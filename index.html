
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Progress & Journal</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-primary: #e0e0e0;
            --text-secondary: #757575;
            --bar-track: #2a2a2a;
            --bar-fill: #ffffff;
            --box-border: #333;
            --box-checked: #ffffff;
            --today-border: #888;
            --panel-bg: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            display: flex;
            overflow-x: hidden;
        }

        /* Layout */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: margin-right 0.3s ease;
        }

        /* Sidebar Journal */
        .journal-panel {
            width: 350px;
            height: 100vh;
            background: var(--panel-bg);
            border-left: 1px solid var(--box-border);
            position: fixed;
            right: -350px;
            top: 0;
            padding: 30px;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .journal-panel.open {
            right: 0;
        }

        /* Zoom Control Button */
        .zoom-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .zoom-btn {
            background: #222;
            border: 1px solid #444;
            color: var(--text-secondary);
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .zoom-btn.active {
            color: #fff;
            border-color: #fff;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
            padding: 60px 20px;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            transform-origin: top center;
        }

        .wrapper.x2 { transform: scale(2); margin-bottom: 120vh; }

        /* Progress Stats */
        .year-label { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.3em; color: var(--text-secondary); margin-bottom: 0.5rem; }
        .percentage-display { font-size: 5rem; font-weight: 300; margin: 0; line-height: 1; }
        .percentage-display span { font-size: 1.5rem; color: var(--text-secondary); }
        .progress-container { width: 100%; height: 4px; background: var(--bar-track); border-radius: 2px; margin: 2.5rem 0; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--bar-fill); transition: width 1.5s ease; }
        .footer-info { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary); }
        .current-date { margin-top: 3rem; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid #222; padding-bottom: 1.5rem; margin-bottom: 2rem; }

        /* Checklist Grid */
        .month-group { text-align: left; margin-bottom: 24px; }
        .month-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; letter-spacing: 0.15em; }
        .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(22px, 1fr)); gap: 6px; }

        .day-checkbox {
            width: 24px;
            height: 24px;
            border: 1px solid var(--box-border);
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: var(--text-secondary);
            transition: background 0.2s;
            user-select: none;
        }

        .day-checkbox.is-today { border-color: var(--today-border); border-width: 1.5px; }
        .day-checkbox:hover { border-color: #666; }

        /* Habit Coloring Logic */
        .day-checkbox.fill-1 { background: #333; color: #fff; }
        .day-checkbox.fill-2 { background: #666; color: #fff; }
        .day-checkbox.fill-3 { background: #999; color: #000; }
        .day-checkbox.fill-4 { background: #fff; color: #000; font-weight: bold; }

        /* Journal Elements */
        .journal-header { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .habit-item { display: flex; align-items: center; margin-bottom: 12px; font-size: 0.9rem; cursor: pointer; }
        .habit-item input { margin-right: 10px; accent-color: #fff; }
        textarea {
            flex: 1;
            background: #111;
            border: 1px solid #333;
            color: #eee;
            padding: 15px;
            border-radius: 5px;
            resize: none;
            font-family: inherit;
            margin-top: 20px;
            line-height: 1.5;
        }
        .close-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="zoom-controls">
        <button class="zoom-btn active" id="btn-1x" onclick="setZoom(1)">1x</button>
        <button class="zoom-btn" id="btn-2x" onclick="setZoom(2)">2x</button>
    </div>

    <div class="main-content" id="content">
        <div class="wrapper" id="main-wrapper">
            <div class="year-label" id="year-text">----</div>
            <h1 class="percentage-display"><span id="percentage">0</span><span>%</span></h1>
            <div class="progress-container"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="footer-info">
                <span>Day <span id="days-passed">0</span></span>
                <span><span id="days-remaining">0</span> days left</span>
            </div>
            <div class="current-date" id="full-date">---</div>
            <div id="calendar-root"></div>
        </div>
    </div>

    <!-- Right Side Journal -->
    <div class="journal-panel" id="journal-panel">
        <div class="close-btn" onclick="closeJournal()">✕</div>
        <div class="journal-header" id="journal-date-title">Date</div>
        
        <div id="habit-checklist">
            <label class="habit-item"><input type="checkbox" data-habit="0"> Meditate</label>
            <label class="habit-item"><input type="checkbox" data-habit="1"> Yoga</label>
            <label class="habit-item"><input type="checkbox" data-habit="2"> Workout</label>
            <label class="habit-item"><input type="checkbox" data-habit="3"> Walk</label>
        </div>

        <textarea id="journal-text" placeholder="Write about your day..."></textarea>
    </div>

    <script>
        let currentEditingKey = null;

        function setZoom(scale) {
            const wrapper = document.getElementById('main-wrapper');
            document.getElementById('btn-1x').classList.toggle('active', scale === 1);
            document.getElementById('btn-2x').classList.toggle('active', scale === 2);
            wrapper.className = scale === 2 ? 'wrapper x2' : 'wrapper';
        }

        function init() {
            const now = new Date();
            const year = now.getFullYear();
            const start = new Date(year, 0, 1);
            const end = new Date(year + 1, 0, 1);
            const totalDays = Math.floor((end - start) / 86400000);
            const daysPassed = Math.floor((now - start) / 86400000) + 1;
            const percent = ((daysPassed / totalDays) * 100).toFixed(1);

            document.getElementById('year-text').innerText = year;
            document.getElementById('percentage').innerText = percent;
            document.getElementById('days-passed').innerText = daysPassed;
            document.getElementById('days-remaining').innerText = totalDays - daysPassed;
            document.getElementById('full-date').innerText = now.toLocaleDateString(undefined, { 
                weekday: 'long', month: 'long', day: 'numeric' 
            });

            setTimeout(() => { document.getElementById('progress-fill').style.width = percent + '%'; }, 300);

            generateChecklist(year, now.getMonth(), now.getDate());
            setupJournalListeners();
        }

        function generateChecklist(year, currentMonth, currentDate) {
            const root = document.getElementById('calendar-root');
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            months.forEach((monthName, monthIdx) => {
                const monthGroup = document.createElement('div');
                monthGroup.className = 'month-group';
                const title = document.createElement('div');
                title.className = 'month-title';
                title.innerText = monthName;
                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';
                
                const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
                
                for (let d = 1; d <= daysInMonth; d++) {
                    const dayBox = document.createElement('div');
                    const dateKey = `${year}-${monthIdx}-${d}`;
                    dayBox.className = 'day-checkbox';
                    dayBox.id = `day-${dateKey}`;
                    dayBox.innerText = d;
                    
                    if (monthIdx === currentMonth && d === currentDate) dayBox.classList.add('is-today');

                    updateBoxVisuals(dayBox, dateKey);

                    dayBox.onclick = () => openJournal(dateKey, monthName, d);
                    daysGrid.appendChild(dayBox);
                }
                monthGroup.appendChild(title);
                monthGroup.appendChild(daysGrid);
                root.appendChild(monthGroup);
            });
        }

        function openJournal(key, month, day) {
            currentEditingKey = key;
            const data = JSON.parse(localStorage.getItem(key)) || { text: "", habits: [false, false, false, false] };
            
            document.getElementById('journal-date-title').innerText = `${month} ${day}`;
            document.getElementById('journal-text').value = data.text;
            
            const checkboxes = document.querySelectorAll('#habit-checklist input');
            checkboxes.forEach((cb, i) => cb.checked = data.habits[i]);

            document.getElementById('journal-panel').classList.add('open');
        }

        function closeJournal() {
            document.getElementById('journal-panel').classList.remove('open');
            currentEditingKey = null;
        }

        function setupJournalListeners() {
            const text = document.getElementById('journal-text');
            const habits = document.querySelectorAll('#habit-checklist input');

            const saveData = () => {
                if (!currentEditingKey) return;
                const habitValues = Array.from(habits).map(cb => cb.checked);
                const data = {
                    text: text.value,
                    habits: habitValues
                };
                localStorage.setItem(currentEditingKey, JSON.stringify(data));
                updateBoxVisuals(document.getElementById(`day-${currentEditingKey}`), currentEditingKey);
            };

            text.oninput = saveData;
            habits.forEach(cb => cb.onchange = saveData);
        }

        function updateBoxVisuals(element, key) {
            if (!element) return;
            const data = JSON.parse(localStorage.getItem(key));
            element.classList.remove('fill-1', 'fill-2', 'fill-3', 'fill-4');
            
            if (data && data.habits) {
                const count = data.habits.filter(h => h === true).length;
                if (count > 0) element.classList.add(`fill-${count}`);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
