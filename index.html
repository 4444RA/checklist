
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Progress & Journal</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-primary: #e0e0e0;
            --text-secondary: #757575;
            --bar-track: #2a2a2a;
            --bar-fill: #ffffff;
            --box-border: #333;
            --today-border: #4caf50;
            --panel-bg: #1a1a1a;
            
            /* Habit Colors */
            --color-meditate: #4a90e2;
            --color-yoga: #a370f7;
            --color-workout: #ff4b2b;
            --color-walk: #2ecc71;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; 
            display: flex; 
            overflow-x: hidden;
            min-height: 100vh;
            cursor: default;
        }

        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: margin-right 0.3s ease;
        }

        .journal-panel {
            width: 350px; height: 100vh; background: var(--panel-bg); border-left: 1px solid var(--box-border);
            position: fixed; right: -350px; top: 0; padding: 30px; transition: right 0.3s ease;
            display: flex; flex-direction: column; z-index: 1000; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .journal-panel.open { right: 0; }

        .zoom-controls { position: fixed; top: 20px; left: 20px; z-index: 1100; display: flex; gap: 10px; }
        .zoom-btn { background: #222; border: 1px solid #444; color: var(--text-secondary); padding: 5px 12px; cursor: pointer; border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; }
        .zoom-btn.active { color: #fff; border-color: #fff; }

        .wrapper { width: 100%; max-width: 450px; padding: 60px 20px; text-align: center; transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1); transform-origin: top center; }
        .wrapper.x2 { transform: scale(2); margin-bottom: 120vh; }

        .percentage-display { font-size: 5rem; font-weight: 300; margin: 0; line-height: 1; padding-top: 20px;}
        
        /* PIKACHU TRACKER STYLES */
        .mascot-container {
            width: 100%;
            height: 50px;
            position: relative;
            margin-top: 20px;
            overflow: visible;
        }
/* PIKACHU TRACKER STYLES */
.mascot-container {
    width: 100%;
    height: 100px;      /* Increased from 50px to fit larger mascot */
    position: relative;
    margin-top: 20px;
    overflow: visible;
}

.pikachu {
    position: absolute;
    height: 90px;       /* Increased from 45px - Adjust this to change size */
    bottom: 0;
    left: 0%; 
    transform: translateX(-50%);
    image-rendering: pixelated; 
    transition: left 1.5s ease;
}

        .progress-container { width: 100%; height: 4px; background: var(--bar-track); border-radius: 2px; margin-bottom: 2.5rem; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--bar-fill); transition: width 1.5s ease; }
        .current-date { margin-top: 3rem; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid #222; padding-bottom: 1.5rem; margin-bottom: 2rem; }

        .month-group { text-align: left; margin-bottom: 24px; }
        .month-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; letter-spacing: 0.15em; }
        .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(24px, 1fr)); gap: 6px; }

        .day-checkbox {
            width: 26px; height: 26px; border: 1px solid var(--box-border); border-radius: 3px;
            cursor: pointer; position: relative; display: grid;
            grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            overflow: hidden; background: #1a1a1a;
        }
        .day-checkbox.is-today { border-color: var(--today-border); border-width: 2px; }
        
        .q { width: 100%; height: 100%; opacity: 0; transition: opacity 0.2s; }
        .q.active { opacity: 1; }
        .q-0 { background: var(--color-meditate); }
        .q-1 { background: var(--color-yoga); }
        .q-2 { background: var(--color-workout); }
        .q-3 { background: var(--color-walk); }

        .day-number {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,0.8);
            pointer-events: none; z-index: 2;
        }

        .journal-header { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .habit-item { display: flex; align-items: center; margin-bottom: 12px; font-size: 0.9rem; cursor: pointer; }
        .habit-item input { margin-right: 10px; cursor: pointer; }
        
        textarea {
            flex: 1; background: #111; border: 1px solid #333; border-left: none; border-right: none;
            color: #eee; padding: 20px 30px; resize: none; font-family: inherit; margin-top: 20px; line-height: 1.5;
            width: calc(100% + 60px); margin-left: -30px; margin-right: -30px; outline: none; cursor: text;
        }
        .close-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--text-secondary); }
    </style>
</head>
<body id="body-root">

    <div class="zoom-controls">
        <button class="zoom-btn active" id="btn-1x" onclick="setZoom(1)">1x</button>
        <button class="zoom-btn" id="btn-2x" onclick="setZoom(2)">2x</button>
    </div>

    <div class="main-content" id="main-content">
        <div class="wrapper" id="main-wrapper">
            <h1 class="percentage-display"><span id="percentage">0</span><span>%</span></h1>
            
            <!-- Pikachu Mascot Area -->
            <div class="mascot-container">
                <img src="mafia-lace-pikachu-run400px.gif" alt="Running Pikachu" class="pikachu" id="pikachu-mascot">
            </div>

            <div class="progress-container"><div class="progress-fill" id="progress-fill"></div></div>
            
            <div class="current-date" id="full-date">---</div>
            <div id="calendar-root"></div>
        </div>
    </div>

    <div class="journal-panel" id="journal-panel">
        <div class="close-btn" onclick="closeJournal()">✕</div>
        <div class="journal-header" id="journal-date-title">Date</div>
        <div id="habit-checklist">
            <label class="habit-item"><input type="checkbox" data-habit="0"> Meditate (Blue)</label>
            <label class="habit-item"><input type="checkbox" data-habit="1"> Yoga (Purple)</label>
            <label class="habit-item"><input type="checkbox" data-habit="2"> Workout (Red)</label>
            <label class="habit-item"><input type="checkbox" data-habit="3"> Walk (Green)</label>
        </div>
        <textarea id="journal-text" placeholder="Write about your day..."></textarea>
    </div>

    <script>
        let currentEditingKey = null;
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function getPerthTime() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Australia/Perth', year: 'numeric', month: 'numeric', day: 'numeric',
                hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false
            });
            const parts = formatter.formatToParts(now);
            const d = {};
            parts.forEach(p => d[p.type] = p.value);
            return new Date(d.year, d.month - 1, d.day, d.hour, d.minute, d.second);
        }

        function setZoom(scale) {
            const wrapper = document.getElementById('main-wrapper');
            document.getElementById('btn-1x').classList.toggle('active', scale === 1);
            document.getElementById('btn-2x').classList.toggle('active', scale === 2);
            wrapper.className = scale === 2 ? 'wrapper x2' : 'wrapper';
        }

        function init() {
            const nowPerth = getPerthTime();
            const year = nowPerth.getFullYear();
            const startOfYear = new Date(year, 0, 1);
            const endOfYear = new Date(year + 1, 0, 1);
            const totalDays = Math.floor((endOfYear - startOfYear) / 86400000);
            const daysPassed = Math.floor((nowPerth - startOfYear) / 86400000) + 1;
            const percent = ((daysPassed / totalDays) * 100).toFixed(1);

            document.getElementById('percentage').innerText = percent;
            const dateOptions = { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'Australia/Perth' };
            document.getElementById('full-date').innerText = new Intl.DateTimeFormat('en-US', dateOptions).format(new Date());

            // Animate Bar and Pikachu
            setTimeout(() => { 
                document.getElementById('progress-fill').style.width = percent + '%';
                document.getElementById('pikachu-mascot').style.left = percent + '%';
            }, 300);

            generateChecklist(year, nowPerth.getMonth(), nowPerth.getDate());
            setupJournalListeners();
            setupInteractions();
        }

        function generateChecklist(year, currentMonth, currentDate) {
            const root = document.getElementById('calendar-root');
            root.innerHTML = '';
            
            months.forEach((monthName, monthIdx) => {
                const monthGroup = document.createElement('div');
                monthGroup.className = 'month-group';
                const title = document.createElement('div');
                title.className = 'month-title'; title.innerText = monthName;
                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';
                
                const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateKey = `${year}-${monthIdx}-${d}`;
                    const dayBox = document.createElement('div');
                    dayBox.className = 'day-checkbox';
                    dayBox.id = `day-${dateKey}`;
                    
                    for (let i = 0; i < 4; i++) {
                        const q = document.createElement('div');
                        q.className = `q q-${i}`;
                        dayBox.appendChild(q);
                    }

                    const num = document.createElement('div');
                    num.className = 'day-number'; num.innerText = d;
                    dayBox.appendChild(num);
                    
                    if (monthIdx === currentMonth && d === currentDate) dayBox.classList.add('is-today');

                    updateBoxVisuals(dayBox, dateKey);
                    dayBox.onclick = (e) => {
                        e.stopPropagation(); 
                        openJournal(dateKey, monthName, d);
                    };
                    daysGrid.appendChild(dayBox);
                }
                monthGroup.appendChild(title);
                monthGroup.appendChild(daysGrid);
                root.appendChild(monthGroup);
            });
        }

        function openJournal(key, month, day) {
            currentEditingKey = key;
            const data = JSON.parse(localStorage.getItem(key)) || { text: "", habits: [false, false, false, false] };
            document.getElementById('journal-date-title').innerText = `${month} ${day}`;
            document.getElementById('journal-text').value = data.text;
            const checkboxes = document.querySelectorAll('#habit-checklist input');
            checkboxes.forEach((cb, i) => cb.checked = data.habits[i]);
            document.getElementById('journal-panel').classList.add('open');
        }

        function closeJournal() {
            document.getElementById('journal-panel').classList.remove('open');
            currentEditingKey = null;
        }

        function setupInteractions() {
            document.getElementById('body-root').addEventListener('click', (e) => {
                const panel = document.getElementById('journal-panel');
                const isPanel = e.target.closest('.journal-panel');
                const isDayBox = e.target.closest('.day-checkbox');
                const isZoom = e.target.closest('.zoom-controls');

                if (isPanel || isDayBox || isZoom) return;

                if (panel.classList.contains('open')) {
                    closeJournal();
                } else {
                    const now = getPerthTime();
                    const todayKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
                    openJournal(todayKey, months[now.getMonth()], now.getDate());
                }
            });
        }

        function setupJournalListeners() {
            const text = document.getElementById('journal-text');
            const habits = document.querySelectorAll('#habit-checklist input');
            const saveData = () => {
                if (!currentEditingKey) return;
                const habitValues = Array.from(habits).map(cb => cb.checked);
                localStorage.setItem(currentEditingKey, JSON.stringify({ text: text.value, habits: habitValues }));
                updateBoxVisuals(document.getElementById(`day-${currentEditingKey}`), currentEditingKey);
            };
            text.oninput = saveData;
            habits.forEach(cb => cb.onchange = saveData);
        }

        function updateBoxVisuals(element, key) {
            if (!element) return;
            const data = JSON.parse(localStorage.getItem(key));
            const quadrants = element.querySelectorAll('.q');
            quadrants.forEach((q, i) => {
                if (data && data.habits && data.habits[i]) {
                    q.classList.add('active');
                } else {
                    q.classList.remove('active');
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
