
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit & Journal Tracker</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: rgba(26, 26, 26, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --box-border: #222;
            --today-border: #ffffff;
            --bar-track: #1a1a1a;
            --bar-fill: #ffffff;

            /* Habit Colors */
            --color-meditate: #4a90e2;
            --color-yoga: #a370f7;
            --color-workout: #ff4b2b;
            --color-walk: #2ecc71;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; 
            display: flex; 
            overflow-x: hidden;
            min-height: 100vh;
            cursor: default;
        }

        /* Layout */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: margin-right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
        }

        /* Premium Glass Journal Panel */
        .journal-panel {
            width: 380px; 
            height: 100vh; 
            background: var(--panel-bg) !important; 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border-left: 1px solid rgba(255, 255, 255, 0.08) !important;
            position: fixed; 
            right: -380px; 
            top: 0; 
            padding: 40px 30px; 
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; 
            flex-direction: column; 
            z-index: 1000; 
            box-shadow: -15px 0 35px rgba(0,0,0,0.6);
        }
        .journal-panel.open { right: 0; }

        .zoom-controls { position: fixed; top: 20px; left: 20px; z-index: 1100; display: flex; gap: 10px; }
        .zoom-btn { background: #111; border: 1px solid #333; color: var(--text-secondary); padding: 6px 14px; cursor: pointer; border-radius: 6px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; transition: 0.2s; }
        .zoom-btn.active { color: #fff; border-color: #666; background: #222; }

        .wrapper { width: 100%; max-width: 450px; padding: 80px 20px; text-align: center; transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); transform-origin: top center; }
        .wrapper.x2 { transform: scale(2); margin-bottom: 120vh; }

        .percentage-display { font-size: 5.5rem; font-weight: 200; margin: 0; line-height: 1; letter-spacing: -2px; }
        .progress-container { width: 100%; height: 2px; background: var(--bar-track); border-radius: 1px; margin: 3rem 0; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--bar-fill); transition: width 1.8s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .current-date { margin-top: 2rem; font-size: 0.8rem; color: var(--text-secondary); border-bottom: 1px solid #1a1a1a; padding-bottom: 1.5rem; margin-bottom: 2.5rem; text-transform: uppercase; letter-spacing: 0.2em; }

        .month-group { text-align: left; margin-bottom: 32px; }
        .month-title { font-size: 0.7rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 12px; letter-spacing: 0.2em; font-weight: 600; opacity: 0.5; }
        .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(24px, 1fr)); gap: 8px; }

        /* Checklist Squares */
        .day-checkbox {
            width: 28px; height: 28px; border: 1px solid var(--box-border); border-radius: 4px;
            cursor: pointer; position: relative; display: grid;
            grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            overflow: hidden; background: #111; transition: transform 0.2s, border-color 0.2s;
        }
        .day-checkbox:hover { border-color: #444; transform: translateY(-1px); }
        .day-checkbox.is-today { border-color: var(--today-border); border-width: 1.5px; box-shadow: 0 0 10px rgba(255,255,255,0.1); }
        
        .q { width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease; }
        .q.active { opacity: 1; }
        .q-0 { background: var(--color-meditate); }
        .q-1 { background: var(--color-yoga); }
        .q-2 { background: var(--color-workout); }
        .q-3 { background: var(--color-walk); }

        .day-number {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 500; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            pointer-events: none; z-index: 2;
        }

        /* Journal Components */
        .journal-header { font-size: 1.4rem; font-weight: 300; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .habit-item { display: flex; align-items: center; margin-bottom: 16px; font-size: 0.9rem; cursor: pointer; color: #ccc; transition: color 0.2s; }
        .habit-item:hover { color: #fff; }
        .habit-item input { margin-right: 12px; cursor: pointer; accent-color: #fff; }
        
        textarea {
            flex: 1; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.05);
            border-left: none; border-right: none;
            color: #eee; padding: 25px 30px; resize: none; font-family: inherit; margin-top: 25px; line-height: 1.6;
            width: calc(100% + 60px); margin-left: -30px; margin-right: -30px; outline: none;
            cursor: text; font-size: 0.95rem;
        }
        
        .close-btn { position: absolute; top: 25px; right: 25px; cursor: pointer; color: var(--text-secondary); font-size: 1.2rem; transition: 0.2s; }
        .close-btn:hover { color: #fff; }
    </style>
</head>
<body id="body-root">

<div class="zoom-controls">
    <button class="zoom-btn active" id="btn-1x" onclick="setZoom(1)">1x</button>
    <button class="zoom-btn" id="btn-2x" onclick="setZoom(2)">2x</button>
</div>

<div class="main-content" id="main-content">
    <div class="wrapper" id="main-wrapper">
        <h1 class="percentage-display"><span id="percentage">0</span><span>%</span></h1>
        <div class="progress-container"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="current-date" id="full-date">---</div>
        <div id="calendar-root"></div>
    </div>
</div>

<div class="journal-panel" id="journal-panel">
    <div class="close-btn" onclick="closeJournal()">✕</div>
    <div class="journal-header" id="journal-date-title">Date</div>
    <div id="habit-checklist">
        <label class="habit-item"><input type="checkbox" data-habit="0"> Meditate</label>
        <label class="habit-item"><input type="checkbox" data-habit="1"> Yoga</label>
        <label class="habit-item"><input type="checkbox" data-habit="2"> Workout</label>
        <label class="habit-item"><input type="checkbox" data-habit="3"> Walk</label>
    </div>
    <textarea id="journal-text" placeholder="What happened today?"></textarea>
</div>

<script>
    let currentEditingKey = null;
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    function getPerthTime() {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Australia/Perth', year: 'numeric', month: 'numeric', day: 'numeric',
            hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false
        });
        const parts = formatter.formatToParts(now);
        const d = {};
        parts.forEach(p => d[p.type] = p.value);
        return new Date(d.year, d.month - 1, d.day, d.hour, d.minute, d.second);
    }

    function setZoom(scale) {
        const wrapper = document.getElementById('main-wrapper');
        document.getElementById('btn-1x').classList.toggle('active', scale === 1);
        document.getElementById('btn-2x').classList.toggle('active', scale === 2);
        wrapper.className = scale === 2 ? 'wrapper x2' : 'wrapper';
    }

    function init() {
        const nowPerth = getPerthTime();
        const year = nowPerth.getFullYear();
        const startOfYear = new Date(year, 0, 1);
        const endOfYear = new Date(year + 1, 0, 1);
        const totalDays = Math.floor((endOfYear - startOfYear) / 86400000);
        const daysPassed = Math.floor((nowPerth - startOfYear) / 86400000) + 1;
        const percent = ((daysPassed / totalDays) * 100).toFixed(1);

        document.getElementById('percentage').innerText = percent;
        const dateOptions = { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'Australia/Perth' };
        document.getElementById('full-date').innerText = new Intl.DateTimeFormat('en-US', dateOptions).format(new Date());

        setTimeout(() => { document.getElementById('progress-fill').style.width = percent + '%'; }, 300);
        generateChecklist(year, nowPerth.getMonth(), nowPerth.getDate());
        setupJournalListeners();
        setupInteractions();
    }

    function generateChecklist(year, currentMonth, currentDate) {
        const root = document.getElementById('calendar-root');
        root.innerHTML = '';
        
        months.forEach((monthName, monthIdx) => {
            const monthGroup = document.createElement('div');
            monthGroup.className = 'month-group';
            const title = document.createElement('div');
            title.className = 'month-title'; title.innerText = monthName;
            const daysGrid = document.createElement('div');
            daysGrid.className = 'days-grid';
            
            const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const dateKey = `${year}-${monthIdx}-${d}`;
                const dayBox = document.createElement('div');
                dayBox.className = 'day-checkbox';
                dayBox.id = `day-${dateKey}`;
                
                for (let i = 0; i < 4; i++) {
                    const q = document.createElement('div');
                    q.className = `q q-${i}`;
                    dayBox.appendChild(q);
                }

                const num = document.createElement('div');
                num.className = 'day-number'; num.innerText = d;
                dayBox.appendChild(num);
                
                if (monthIdx === currentMonth && d === currentDate) dayBox.classList.add('is-today');

                updateBoxVisuals(dayBox, dateKey);
                dayBox.onclick = (e) => {
                    e.stopPropagation(); 
                    openJournal(dateKey, monthName, d);
                };
                daysGrid.appendChild(dayBox);
            }
            monthGroup.appendChild(title);
            monthGroup.appendChild(daysGrid);
            root.appendChild(monthGroup);
        });
    }

    function openJournal(key, month, day) {
        currentEditingKey = key;
        const data = JSON.parse(localStorage.getItem(key)) || { text: "", habits: [false, false, false, false] };
        document.getElementById('journal-date-title').innerText = `${month} ${day}`;
        document.getElementById('journal-text').value = data.text;
        const checkboxes = document.querySelectorAll('#habit-checklist input');
        checkboxes.forEach((cb, i) => cb.checked = data.habits[i]);
        document.getElementById('journal-panel').classList.add('open');
    }

    function closeJournal() {
        document.getElementById('journal-panel').classList.remove('open');
        currentEditingKey = null;
    }

    function setupInteractions() {
        document.getElementById('body-root').addEventListener('click', (e) => {
            const panel = document.getElementById('journal-panel');
            const isPanel = e.target.closest('.journal-panel');
            const isDayBox = e.target.closest('.day-checkbox');
            const isZoom = e.target.closest('.zoom-controls');

            if (isPanel || isDayBox || isZoom) return;

            if (panel.classList.contains('open')) {
                closeJournal();
            } else {
                const now = getPerthTime();
                const todayKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
                openJournal(todayKey, months[now.getMonth()], now.getDate());
            }
        });
    }

    function setupJournalListeners() {
        const text = document.getElementById('journal-text');
        const habits = document.querySelectorAll('#habit-checklist input');
        const saveData = () => {
            if (!currentEditingKey) return;
            const habitValues = Array.from(habits).map(cb => cb.checked);
            localStorage.setItem(currentEditingKey, JSON.stringify({ text: text.value, habits: habitValues }));
            updateBoxVisuals(document.getElementById(`day-${currentEditingKey}`), currentEditingKey);
        };
        text.oninput = saveData;
        habits.forEach(cb => cb.onchange = saveData);
    }

    function updateBoxVisuals(element, key) {
        if (!element) return;
        const data = JSON.parse(localStorage.getItem(key));
        const quadrants = element.querySelectorAll('.q');
        quadrants.forEach((q, i) => {
            if (data && data.habits && data.habits[i]) {
                q.classList.add('active');
            } else {
                q.classList.remove('active');
            }
        });
    }

    window.onload = init;
</script>

</body>
</html>
