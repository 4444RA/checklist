<!DOCTYPE html>
<html lang="en" style="background-color: #0a0a0a; color-scheme: dark;">
<head>
    <link rel="apple-touch-icon" href="icon-v2.png">
    <meta name="color-scheme" content="dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>LPP Power & Hypertrophy Tracker</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-color: #0a0a0a;
            --surface-color: #141414;
            --surface-border: #222222;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-muted: #555555;
            --btn-bg: #1a1a1a;
            --btn-border: #333333;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background-color: var(--bg-color); color: var(--text-primary); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 520px; padding: 16px 14px 170px 14px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .tabs-nav {
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
            background: var(--surface-color); padding: 4px; border-radius: 8px;
            border: 1px solid var(--surface-border); position: sticky; top: 10px; z-index: 50;
        }
        .tab-btn {
            background: transparent; border: none; color: var(--text-secondary);
            padding: 8px 1px; border-radius: 6px; font-weight: 600; font-size: 0.56rem;
            cursor: pointer; text-align: center; transition: 0.15s; letter-spacing: 0.01em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .tab-btn.active { background: #262626; color: #fff; }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 8px; border-bottom: 1px solid var(--surface-border);
        }
        .section-title { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; }
        .session-date-picker {
            background: transparent; border: 1px solid var(--surface-border);
            color: var(--text-secondary); font-size: 0.8rem; border-radius: 6px; padding: 4px 8px;
        }

        /* Warm-up card */
        .warmup-card {
            background: #0d0d0d;
            border: 1px dashed #2a2a2a;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .warmup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .warmup-title {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .warmup-toggle-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 0.65rem;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }
        .warmup-toggle-btn:hover { color: #aaa; }
        .warmup-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .warmup-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
            font-size: 0.75rem;
            padding-left: 8px;
            border-left: 2px solid #282828;
        }
        .warmup-item-name {
            font-weight: 600;
            color: #ddd;
        }
        .warmup-item-cue {
            font-size: 0.65rem;
            color: #777;
        }

        .card {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
        }
        .card-top { display: flex; justify-content: space-between; align-items: baseline; }
        .exercise-name { font-size: 0.95rem; font-weight: 600; margin: 0; }
        .exercise-target { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 500; }
        
        .prev-reference {
            background: #090909; border-radius: 6px; padding: 6px 10px;
            font-size: 0.75rem; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center;
        }
        .prev-data { color: #ccc; font-family: monospace; font-size: 0.75rem; }
        .chart-icon-btn {
            background: transparent; border: none; color: #fff;
            cursor: pointer; font-size: 0.7rem; padding: 2px 4px; text-decoration: underline; opacity: 0.6;
        }
        .chart-icon-btn:hover { opacity: 1; }

        /* Sets block with dynamic controls */
        .sets-block-container {
            display: flex; flex-direction: column; gap: 6px;
        }
        .sets-block {
            display: flex; flex-direction: column; gap: 6px; background: #0c0c0c;
            padding: 8px 10px; border-radius: 6px; border: 1px solid #1a1a1a;
        }
        .set-row {
            display: grid; grid-template-columns: 55px 1fr 18px 1fr; gap: 8px;
            align-items: center;
        }
        .set-tag { font-size: 0.7rem; font-weight: 600; color: #666; text-transform: uppercase; }
        .set-x { font-size: 0.75rem; color: #444; text-align: center; }
        .num-input {
            width: 100%; background: #050505; border: 1px solid #282828; border-radius: 6px;
            color: #fff; padding: 7px 0; text-align: center; font-size: 0.9rem; font-weight: 600;
            outline: none;
        }
        .num-input:focus { border-color: #555; }

        .backoff-hint {
            font-size: 0.65rem; color: #aaa; font-family: monospace; padding: 0 4px;
        }

        .set-adjust-bar {
            display: flex; justify-content: space-between; align-items: center; margin-top: 2px;
        }
        .set-adjust-btn {
            background: transparent; border: 1px solid #2a2a2a; color: #777;
            font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; cursor: pointer;
        }
        .set-adjust-btn:hover { color: #fff; border-color: #444; }

        .card-footer-grid {
            display: grid; grid-template-columns: 75px 1fr auto; gap: 8px; align-items: center;
        }
        .notes-input {
            width: 100%; background: #080808; border: 1px solid #222; border-radius: 6px;
            color: #bbb; padding: 8px 10px; font-size: 0.75rem; outline: none;
        }
        .save-btn {
            background: #ffffff; color: #000; border: none; font-weight: 600;
            font-size: 0.75rem; padding: 8px 14px; border-radius: 6px; cursor: pointer;
            transition: all 0.2s ease; white-space: nowrap;
        }
        .save-btn.undo-active {
            background: #2a2a2a; color: #fff; border: 1px solid #555;
        }

        /* Metric Cards */
        .dash-metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .dash-metric-card {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            padding: 14px; border-radius: 8px; text-align: left;
        }
        .metric-label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; }
        .metric-value { font-size: 1.8rem; font-weight: 200; margin: 0; line-height: 1; color: #ffffff; }
        .metric-sub { font-size: 0.65rem; color: #666; margin-top: 4px; }

        /* Day Toggle Selector for Stacked Charts */
        .day-toggle-bar {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 14px;
        }
        .day-toggle-btn {
            background: #141414; border: 1px solid var(--surface-border); color: var(--text-secondary);
            font-size: 0.7rem; font-weight: 600; padding: 8px 0; border-radius: 6px;
            cursor: pointer; transition: 0.15s; text-align: center;
        }
        .day-toggle-btn.active {
            background: #262626; color: #fff; border-color: #444;
        }

        .stacked-charts-wrapper {
            display: flex; flex-direction: column; gap: 12px;
        }
        .chart-card-stacked {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            border-radius: 8px; padding: 12px 12px 10px 12px;
        }
        .chart-card-header {
            display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;
        }
        .chart-card-title { font-size: 0.85rem; font-weight: 600; color: #ffffff; }
        .chart-card-pr { font-size: 0.75rem; color: var(--text-secondary); font-family: monospace; }
        .chart-canvas-box { position: relative; height: 170px; width: 100%; }

        .history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .history-item {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            border-radius: 6px; padding: 10px 12px; font-size: 0.75rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .cloud-badge {
            font-size: 0.65rem; color: var(--text-secondary); display: flex;
            align-items: center; gap: 4px; font-weight: 500;
        }
        .delete-btn {
            background: transparent; border: none; color: #555; cursor: pointer;
            font-size: 0.8rem; padding: 2px 6px;
        }
        .delete-btn:hover { color: #fff; }

        .weight-input-grid {
            display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 8px; align-items: center;
        }

        /* --- TECH NECK CHECKLIST STYLES --- */
        .neck-item-card {
            background: #0f0f0f;
            border: 1px solid #222222;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }
        .neck-item-card.completed {
            background: #0a0a0a;
            border-color: #2e2e2e;
        }
        .neck-checkbox {
            width: 20px;
            height: 20px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #080808;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            transition: 0.15s;
        }
        .neck-item-card.completed .neck-checkbox {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
        }
        .neck-checkbox::after {
            content: '✓';
            font-size: 12px;
            font-weight: 900;
            display: none;
        }
        .neck-item-card.completed .neck-checkbox::after {
            display: block;
        }
        .neck-item-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .neck-item-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            transition: color 0.15s;
        }
        .neck-item-card.completed .neck-item-name {
            color: #888888;
        }
        .neck-item-cue {
            font-size: 0.7rem;
            color: #777777;
            line-height: 1.35;
        }
        .neck-progress-track {
            width: 100%;
            height: 4px;
            background: #1c1c1c;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 6px;
        }
        .neck-progress-fill {
            height: 100%;
            background: #ffffff;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* --- DIET TRACKER STYLES --- */
        .diet-macro-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #0c0c0c;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            padding: 10px;
        }
        .diet-macro-cell {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: center;
        }
        .diet-macro-label {
            font-size: 0.62rem;
            color: #666;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .diet-macro-val {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            font-family: monospace;
        }
        .diet-macro-sub {
            font-size: 0.62rem;
            color: #666;
        }
        .diet-status-pill {
            font-size: 0.68rem;
            font-family: monospace;
            padding: 3px 8px;
            border-radius: 4px;
            background: #1a1a1a;
            border: 1px solid #2c2c2c;
            color: #ccc;
        }
        .diet-status-pill.met {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 700;
        }
        .diet-multiplier-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr) 64px;
            gap: 4px;
            align-items: center;
        }
        .diet-mult-btn {
            background: #0c0c0c;
            border: 1px solid #262626;
            color: #888;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 7px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.12s;
        }
        .diet-mult-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .diet-food-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .diet-food-row {
            background: #0c0c0c;
            border: 1px solid #1b1b1b;
            border-radius: 6px;
            padding: 9px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .diet-food-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .diet-food-name {
            font-size: 0.82rem;
            font-weight: 600;
            color: #fff;
        }
        .diet-food-macros {
            font-size: 0.67rem;
            color: #888;
            font-family: monospace;
        }
        .diet-add-btn {
            background: #1e1e1e;
            border: 1px solid #363636;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .diet-add-btn:active {
            background: #ffffff;
            color: #000000;
        }
        .diet-log-item {
            background: #0d0d0d;
            border: 1px solid #1f1f1f;
            border-radius: 6px;
            padding: 9px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .diet-qty-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .diet-qty-btn {
            background: #181818;
            border: 1px solid #2e2e2e;
            color: #ccc;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .diet-qty-btn:active {
            background: #fff;
            color: #000;
        }
        .diet-qty-label {
            font-size: 0.72rem;
            font-family: monospace;
            color: #fff;
            min-width: 30px;
            text-align: center;
        }
        .diet-custom-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        /* 2-TIER REST TIMER DOCK */
        .rest-timer-dock {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 20px);
            max-width: 500px;
            background: rgba(16, 16, 16, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9);
            transition: border-color 0.3s;
        }
        .rest-timer-dock.alert-active {
            border-color: #ffffff;
            animation: pulseAlertBorder 0.8s infinite alternate;
        }
        @keyframes pulseAlertBorder {
            from { border-color: #333333; box-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
            to { border-color: #ffffff; box-shadow: 0 0 25px rgba(255, 255, 255, 0.4); }
        }

        .timer-top-row {
            display: flex; justify-content: space-between; align-items: center;
        }
        .timer-info-group {
            display: flex; align-items: baseline; gap: 8px;
        }
        .timer-digits {
            font-size: 1.6rem; font-weight: 300; color: #ffffff; font-family: monospace; line-height: 1;
        }
        .timer-digits.completed {
            font-weight: 700;
        }
        .timer-label {
            font-size: 0.65rem; color: #888; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;
        }

        .timer-action-buttons {
            display: flex; gap: 6px; align-items: center;
        }
        .timer-utility-btn {
            background: #202020; border: 1px solid #3a3a3a; color: #ffffff;
            font-size: 0.75rem; font-weight: 600; padding: 6px 12px; border-radius: 6px;
            cursor: pointer;
        }
        .timer-utility-btn:active { background: #333; }

        .timer-presets-grid {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px;
        }
        .timer-preset-btn {
            background: #1c1c1c; border: 1px solid #2f2f2f; color: #ffffff;
            font-size: 0.85rem; font-weight: 700; height: 38px; border-radius: 6px;
            cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center;
        }
        .timer-preset-btn:active {
            background: #ffffff; color: #000;
        }
    </style>
</head>
<body>

<div id="app-container" class="app-container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:0.75rem; font-weight:600; letter-spacing:0.05em; color:var(--text-secondary);">BODY & PERFORMANCE</span>
        <span id="sync-status" class="cloud-badge">Synced</span>
    </div>

    <!-- Navigation: 8 Tabs -->
    <nav class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('LEGS')">LEGS</button>
        <button class="tab-btn" onclick="switchTab('PUSH')">PUSH</button>
        <button class="tab-btn" onclick="switchTab('PULL')">PULL</button>
        <button class="tab-btn" onclick="switchTab('REC')">REC</button>
        <button class="tab-btn" onclick="switchTab('NECK')">NECK</button>
        <button class="tab-btn" onclick="switchTab('DIET')">DIET</button>
        <button class="tab-btn" onclick="switchTab('WEIGHT')">WEIGHT</button>
        <button class="tab-btn" onclick="switchTab('DASH')">STATS</button>
    </nav>

    <div id="tab-content"></div>
</div>

<!-- Floating Rest Timer Dock -->
<div id="rest-dock" class="rest-timer-dock">
    <div class="timer-top-row">
        <div class="timer-info-group">
            <span id="timer-display" class="timer-digits">00:00</span>
            <span id="timer-status" class="timer-label">Rest Timer</span>
        </div>
        <div class="timer-action-buttons">
            <button class="timer-utility-btn" onclick="addRestSeconds(30)">+30s</button>
            <button class="timer-utility-btn" onclick="stopRestTimer()">✕</button>
        </div>
    </div>
    <div class="timer-presets-grid">
        <button class="timer-preset-btn" onclick="startRestTimer(60)">1m</button>
        <button class="timer-preset-btn" onclick="startRestTimer(90)">1.5</button>
        <button class="timer-preset-btn" onclick="startRestTimer(120)">2m</button>
        <button class="timer-preset-btn" onclick="startRestTimer(180)">3m</button>
        <button class="timer-preset-btn" onclick="startRestTimer(240)">4m</button>
        <button class="timer-preset-btn" onclick="startRestTimer(300)">5m</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    function unlockIOSAudio() {
        if (!sharedAudioCtx) {
            sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (sharedAudioCtx.state === 'suspended') {
            sharedAudioCtx.resume();
        }
        try {
            const osc = sharedAudioCtx.createOscillator();
            const gain = sharedAudioCtx.createGain();
            gain.gain.value = 0.0001;
            osc.connect(gain);
            gain.connect(sharedAudioCtx.destination);
            osc.start();
            osc.stop(sharedAudioCtx.currentTime + 0.05);
        } catch(e) {}
    }

    document.addEventListener('touchstart', unlockIOSAudio, { once: true });
    document.addEventListener('click', unlockIOSAudio, { once: true });

    function playAlertTone(freq = 880, duration = 0.25) {
        unlockIOSAudio();
        if (!sharedAudioCtx) return;

        try {
            const osc = sharedAudioCtx.createOscillator();
            const gain = sharedAudioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, sharedAudioCtx.currentTime);
            gain.gain.setValueAtTime(0.35, sharedAudioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, sharedAudioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(sharedAudioCtx.destination);
            osc.start();
            osc.stop(sharedAudioCtx.currentTime + duration);
        } catch(e) {}
    }

    function triggerRestFinishedAlert() {
        playAlertTone(880, 0.25);
        setTimeout(() => playAlertTone(880, 0.25), 280);
        setTimeout(() => playAlertTone(1174, 0.45), 560);

        if (navigator.vibrate) {

    function formatTime(totalSeconds) {
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function startRestTimer(seconds) {
        unlockIOSAudio();
        clearInterval(restTimerInterval);
        restSecondsRemaining = seconds;

        const display = document.getElementById('timer-display');
        const status = document.getElementById('timer-status');
        const dock = document.getElementById('rest-dock');

        if (dock) dock.classList.remove('alert-active');
        display.classList.remove('completed');
        status.textContent = "Resting";
        display.textContent = formatTime(restSecondsRemaining);

        playAlertTone(440, 0.08);

        restTimerInterval = setInterval(() => {
            restSecondsRemaining--;
            if (restSecondsRemaining <= 0) {
                clearInterval(restTimerInterval);
                display.textContent = "READY!";
                display.classList.add('completed');
                status.textContent = "Start Set";
                triggerRestFinishedAlert();
            } else {
                display.textContent = formatTime(restSecondsRemaining);
            }
        }, 1000);
    }

    function addRestSeconds(seconds) {
        unlockIOSAudio();
        restSecondsRemaining += seconds;
        const display = document.getElementById('timer-display');

        const dock = document.getElementById('rest-dock');

        if (dock) dock.classList.remove('alert-active');
        display.classList.remove('completed');
        display.textContent = formatTime(restSecondsRemaining);

        if (!restTimerInterval && restSecondsRemaining > 0) {
            status.textContent = "Resting";
            restTimerInterval = setInterval(() => {
                restSecondsRemaining--;
                if (restSecondsRemaining <= 0) {

    function autoPropagateWeight(exerciseId, setIndex, value) {
        const valNum = parseFloat(value);
        const isBackoff = isBackoffExercise(exerciseId);
        const hintEl = document.getElementById(`hint_${exerciseId}`);

        if (setIndex === 1) {
            if (!isNaN(valNum) && valNum > 0 && isBackoff) {
                const backoffWeight = Math.round((valNum * 0.90) * 2) / 2;
                
                if (hintEl) {
                    hintEl.style.display = "block";
                    hintEl.textContent = `⚡ Back-off: ${backoffWeight}kg (-10%)`;
                }

                const el2 = document.getElementById(`w_${exerciseId}_s2`);
                if (el2 && (!el2.value || el2.dataset.autoFilled === "true")) {
                    el2.value = backoffWeight;
                    el2.dataset.autoFilled = "true";
                }

                for (let s = 3; s <= 6; s++) {
                    const el = document.getElementById(`w_${exerciseId}_s${s}`);
                    if (el && (!el.value || el.dataset.autoFilled === "true")) {
                        el.value = backoffWeight;
                        el.dataset.autoFilled = "true";
                    }
                }
            } else {
                if (hintEl) hintEl.style.display = "none";
                for (let s = 2; s <= 6; s++) {
                    const el = document.getElementById(`w_${exerciseId}_s${s}`);
                    if (el && (!el.value || el.dataset.autoFilled === "true")) {
                        el.value = value;
                        el.dataset.autoFilled = "true";
                    }
                }
            }
        }
    }

        if (prev.sets && Array.isArray(prev.sets)) {

            if (allSameWeight) {
                const repsStr = prev.sets.map(s => s.r).join(', ');
                return `${prev.sets[0].w}kg · [${repsStr}] · RIR ${prev.rir || '-'}`;
            } else {
                const breakdown = prev.sets.map(s => `${s.w}k×${s.r}`).join(', ');
                return `${breakdown} · RIR ${prev.rir || '-'}`;
            }
        }
        return `${prev.weight}kg · [${prev.s1}, ${prev.s2}, ${prev.s3 || '-'}] · RIR ${prev.rir || '-'}`;
    }

    function handleLogClick(exerciseId, numSets) {
        const btn = document.getElementById(`btn_${exerciseId}`);

        if (btn.classList.contains('undo-active')) {
            const lastEntryId = btn.dataset.lastEntryId;
            if (lastEntryId) {
                deleteEntry(lastEntryId, false);
            }
            clearTimeout(undoTimers[exerciseId]);
            btn.classList.remove('undo-active');
            btn.textContent = "Log";
            return;
        }

        const date = document.getElementById('session-date').value;
        const rir = document.getElementById(`rir_${exerciseId}`).value || "-";
        const notes = document.getElementById(`notes_${exerciseId}`).value;

        const setsData = [];
        let topWeight = 0;

        for (let s = 1; s <= numSets; s++) {
            const w = parseFloat(document.getElementById(`w_${exerciseId}_s${s}`).value) || 0;
            const r = parseInt(document.getElementById(`r_${exerciseId}_s${s}`).value) || 0;
            if (w > topWeight) topWeight = w;
            setsData.push({ set: s, w: w, r: r });
        }

        const hasAnyData = setsData.some(s => s.r > 0 || s.w > 0);
        if (!hasAnyData) {
            alert("Please input at least one set with weight and reps.");
            return;
        }

        const logId = `entry_${Date.now()}`;
        const newLog = {
            id: logId,
            date: date,
            day: currentTab,
            exerciseId: exerciseId,
            weight: topWeight,
            sets: setsData,
            rir: rir,
            notes: notes
        };

        workoutDbRef.child(logId).set(newLog);

        btn.classList.add('undo-active');
        btn.dataset.lastEntryId = logId;
        btn.textContent = "Undo";

        undoTimers[exerciseId] = setTimeout(() => {
            if (btn) {
                btn.classList.remove('undo-active');
                btn.textContent = "Log";
            }
        }, 5000);
    }

    // --- DAILY DIET TRACKER TAB ---
    function round1(val) {
        return Math.round(val * 10) / 10;
    }

    function getDietEntriesForDate(dateStr) {
        const dayObj = dietLogs[dateStr];
        if (!dayObj || !dayObj.entries) return [];
        return Object.values(dayObj.entries).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
    }

    function calculateDayTotals(entries) {
        return entries.reduce((acc, item) => {
            const mult = parseFloat(item.servings) || 1;
            acc.calories += (parseFloat(item.calories) || 0) * mult;
            acc.protein += (parseFloat(item.protein) || 0) * mult;
            acc.carbs += (parseFloat(item.carbs) || 0) * mult;
            acc.fat += (parseFloat(item.fat) || 0) * mult;
            return acc;
        }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
    }

    function renderDietTab(container) {
        const entries = getDietEntriesForDate(selectedDietDate);
        const totals = calculateDayTotals(entries);
        const totalCal = Math.round(totals.calories);
        const totalP = round1(totals.protein);
        const totalC = round1(totals.carbs);
        const totalF = round1(totals.fat);

        const targetCal = parseInt(dietTarget.calories) || 2800;
        const targetP = parseInt(dietTarget.protein) || 0;
        const calPercent = Math.min(100, Math.round((totalCal / targetCal) * 100));
        const diffCal = targetCal - totalCal;
        const statusText = diffCal >= 0 ? `${diffCal} kcal left` : `+${Math.abs(diffCal)} kcal over`;
        const isGoalMet = totalCal >= targetCal;

        // Today's Logged Foods HTML
        let loggedHtml = "";
        if (entries.length === 0) {
            loggedHtml = `<div style="color:#555; font-size:0.75rem; padding:4px 0;">No foods logged for ${selectedDietDate}. Tap a food below to add.</div>`;
        } else {
            entries.forEach(item => {
                const mult = parseFloat(item.servings) || 1;
                const cals = Math.round(item.calories * mult);
                const p = round1(item.protein * mult);
                const c = round1(item.carbs * mult);
                const f = round1(item.fat * mult);

                loggedHtml += `
                    <div class="diet-log-item">
                        <div class="diet-food-info">
                            <span class="diet-food-name">${escapeHtml(item.name)}</span>

                            <button class="delete-btn" onclick="deleteDietEntry('${selectedDietDate}', '${item.id}')" style="margin-left:2px;">✕</button>

                const pPro = round1(food.protein * mult);
                const pCarb = round1(food.carbs * mult);
                const pFat = round1(food.fat * mult);
                const multLabel = mult === 1 ? "" : ` (${mult}×)`;

                presetHtml += `
                    <div class="diet-food-row">
                        <div class="diet-food-info">
                            <span class="diet-food-name">${food.name}</span>
                            <span class="diet-food-macros">${pCal} kcal · ${pPro}P · ${pCarb}C · ${pFat}F${multLabel}</span>
                        </div>
                        <button class="diet-add-btn" onclick="addPresetFood('${food.id}')">+ Add</button>
                    </div>
                `;
            });
        }

        // Recent 7 days summary
        const recentDates = Object.keys(dietLogs)
            .filter(d => getDietEntriesForDate(d).length > 0)
            .sort((a, b) => new Date(b) - new Date(a))
            .slice(0, 7);

        let recentDaysHtml = "";
        if (recentDates.length === 0) {
            recentDaysHtml = `<div style="color:#444; font-size:0.75rem;">No daily calorie logs recorded yet.</div>`;
        } else {
            recentDates.forEach(d => {
                const dayEntries = getDietEntriesForDate(d);
                const dayTot = calculateDayTotals(dayEntries);
                const dCal = Math.round(dayTot.calories);

                    <div class="history-item" style="cursor:pointer;" onclick="changeDietDate('${d}')">
                        <div>
                            <strong style="font-size:0.8rem;">${d}</strong>

                        </div>
                        <div style="display:flex; align-items:center; gap:8px; font-family:monospace;">

                            <span style="font-size:0.65rem; color:${hit ? '#fff' : '#666'};">${hit ? '✓' : `${Math.round((dCal/targetCal)*100)}%`}</span>

                        <div style="display:flex; align-items:baseline; gap:6px;">

                    </div>
                    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
                        <span class="diet-status-pill ${isGoalMet ? 'met' : ''}">${isGoalMet ? 'Goal Met ✓ · ' + statusText : statusText}</span>
                        <button class="warmup-toggle-btn" onclick="toggleDietGoalEditor()">${showDietGoalEditor ? 'Close Goal' : 'Edit Goal'}</button>

                </div>

                <div class="neck-progress-track">
                    <div class="neck-progress-fill" style="width:${calPercent}%;"></div>
                </div>

                ${showDietGoalEditor ? `
                    <div style="background:#0c0c0c; border:1px solid #222; border-radius:6px; padding:10px; display:flex; flex-direction:column; gap:8px;">
                        <div style="font-size:0.68rem; color:#888; font-weight:600; text-transform:uppercase;">Daily Targets</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center;">
                            <input type="number" id="diet-goal-cal" class="num-input" value="${targetCal}" placeholder="kcal">
                            <input type="number" id="diet-goal-pro" class="num-input" value="${targetP}" placeholder="Protein g">
                            <button class="save-btn" onclick="saveDietGoals()">Save</button>
                        </div>
                    </div>
                ` : ''}

                <div class="diet-macro-grid">
                    <div class="diet-macro-cell">
                        <span class="diet-macro-label">Protein</span>
                        <span class="diet-macro-val">${totalP}g</span>

                    </div>
                    <div class="diet-macro-cell">

                        <span class="diet-macro-val">${totalC}g</span>
                        <span class="diet-macro-sub">total</span>
                    </div>
                    <div class="diet-macro-cell">
                        <span class="diet-macro-label">Fat</span>
                        <span class="diet-macro-val">${totalF}g</span>
                        <span class="diet-macro-sub">total</span>
                    </div>

            <!-- Today's Food Log -->
            <div class="card">
                <div class="card-top">
                    <span class="exercise-name">Logged Today</span>

                <div style="display:flex; flex-direction:column; gap:6px;">
                    ${loggedHtml}
                </div>
            </div>

            <!-- Preset Quick-Add Foods -->
            <div class="card">
                <div class="card-top">
                    <span class="exercise-name">Quick-Add Foods</span>
                    <button class="warmup-toggle-btn" onclick="toggleCustomFoodForm()">${showCustomFoodForm ? 'Hide Custom' : '+ Custom Food'}</button>
                </div>
                <div style="font-size:0.68rem; color:#777; line-height:1.35;">
                    All values are estimates unless you supplied the exact macros. Serving sizes are listed so you know what each entry represents.
                </div>

                ${showCustomFoodForm ? `
                    <div style="background:#0a0a0a; border:1px solid #262626; border-radius:6px; padding:10px; display:flex; flex-direction:column; gap:8px;">
                        <input type="text" id="custom-food-name" class="notes-input" placeholder="Food name (e.g. Protein shake)">
                        <div class="diet-custom-grid">
                            <input type="number" id="custom-food-cal" class="num-input" placeholder="kcal">
                            <input type="number" step="0.5" id="custom-food-pro" class="num-input" placeholder="Prot g">
                            <input type="number" step="0.5" id="custom-food-carb" class="num-input" placeholder="Carb g">
                            <input type="number" step="0.5" id="custom-food-fat" class="num-input" placeholder="Fat g">
                        </div>
                        <button class="save-btn" style="width:100%;" onclick="addCustomFood()">Add Custom Entry (${mult}×)</button>
                    </div>
                ` : ''}

                <div style="display:flex; flex-direction:column; gap:6px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.68rem; color:#888; font-weight:600; text-transform:uppercase;">Serving Multiplier</span>
                        <span style="font-size:0.68rem; color:#aaa; font-family:monospace;">Adding ${mult}× serving</span>
                    </div>
                    <div class="diet-multiplier-bar">
                        ${multButtonsHtml}
                        <input type="number" step="0.25" min="0.1" id="diet-custom-mult" class="num-input" style="padding:5px 2px; font-size:0.75rem;" value="${mult}" onchange="setDietMultiplier(this.value)">
                    </div>
                </div>

                <input type="text" id="diet-search-input" class="notes-input" placeholder="Filter foods (e.g. chicken, milk, oats)..." value="${escapeHtml(dietSearchQuery)}" oninput="updateDietSearch(this.value)">

                <div class="diet-food-list">
                    ${presetHtml}
                </div>
            </div>

            <div style="font-size: 0.8rem; font-weight: 600; margin-top: 6px; color: var(--text-secondary);">RECENT DAYS</div>
            <div class="history-list">

        if (dietSearchQuery) {
            const searchEl = document.getElementById('diet-search-input');
            if (searchEl) {

                searchEl.setSelectionRange(len, len);

    function changeDietDate(dateStr) {
        if (!dateStr) return;
        selectedDietDate = dateStr;
        renderDietTab(document.getElementById('tab-content'));
    }

    function toggleDietGoalEditor() {
        showDietGoalEditor = !showDietGoalEditor;
        renderDietTab(document.getElementById('tab-content'));
    }

    function toggleCustomFoodForm() {
        showCustomFoodForm = !showCustomFoodForm;
        renderDietTab(document.getElementById('tab-content'));
    }

    function saveDietGoals() {
        const cal = parseInt(document.getElementById('diet-goal-cal').value);
        const pro = parseInt(document.getElementById('diet-goal-pro').value) || 0;
        if (!cal || cal <= 0) {
            alert("Please enter a valid calorie target.");
            return;
        }
        dietTarget = { calories: cal, protein: pro };
        localStorage.setItem('diet_target_cache', JSON.stringify(dietTarget));
        dietTargetDbRef.set(dietTarget);
        showDietGoalEditor = false;
        renderDietTab(document.getElementById('tab-content'));
    }

    function setDietMultiplier(val) {
        const num = parseFloat(val);
        if (!isNaN(num) && num > 0) {
            dietServingMultiplier = round1(num);
        } else {
            dietServingMultiplier = 1;
        }
        renderDietTab(document.getElementById('tab-content'));
    }

    function updateDietSearch(val) {
        dietSearchQuery = val;
        renderDietTab(document.getElementById('tab-content'));
    }

    function addPresetFood(foodId) {
        const food = DIET_FOODS.find(f => f.id === foodId);
        if (!food) return;

        const mult = dietServingMultiplier > 0 ? dietServingMultiplier : 1;
        const entryId = `food_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
        const entry = {
            id: entryId,
            foodId: food.id,
            name: food.name,
            calories: food.calories,
            protein: food.protein,
            carbs: food.carbs,
            fat: food.fat,
            servings: mult,
            timestamp: Date.now()
        };

        if (!dietLogs[selectedDietDate]) dietLogs[selectedDietDate] = { entries: {} };
        if (!dietLogs[selectedDietDate].entries) dietLogs[selectedDietDate].entries = {};
        dietLogs[selectedDietDate].entries[entryId] = entry;

        localStorage.setItem('diet_log_cache', JSON.stringify(dietLogs));
        dietDbRef.child(selectedDietDate).child('entries').child(entryId).set(entry);

        renderDietTab(document.getElementById('tab-content'));
    }

    function addCustomFood() {
        const name = (document.getElementById('custom-food-name').value || '').trim();
        const cal = parseFloat(document.getElementById('custom-food-cal').value) || 0;
        const pro = parseFloat(document.getElementById('custom-food-pro').value) || 0;
        const carb = parseFloat(document.getElementById('custom-food-carb').value) || 0;
        const fat = parseFloat(document.getElementById('custom-food-fat').value) || 0;

        if (!name || cal <= 0) {
            alert("Please enter a food name and calories.");
            return;
        }

        const mult = dietServingMultiplier > 0 ? dietServingMultiplier : 1;
        const entryId = `food_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
        const entry = {
            id: entryId,
            foodId: 'custom',
            name: name,
            calories: cal,
            protein: pro,
            carbs: carb,
            fat: fat,
            servings: mult,
            timestamp: Date.now()
        };

        if (!dietLogs[selectedDietDate]) dietLogs[selectedDietDate] = { entries: {} };
        if (!dietLogs[selectedDietDate].entries) dietLogs[selectedDietDate].entries = {};
        dietLogs[selectedDietDate].entries[entryId] = entry;

        localStorage.setItem('diet_log_cache', JSON.stringify(dietLogs));
        dietDbRef.child(selectedDietDate).child('entries').child(entryId).set(entry);

        showCustomFoodForm = false;
        renderDietTab(document.getElementById('tab-content'));
    }

    function adjustDietServing(dateStr, entryId, delta) {
        const dayObj = dietLogs[dateStr];
        if (!dayObj || !dayObj.entries || !dayObj.entries[entryId]) return;

        const current = parseFloat(dayObj.entries[entryId].servings) || 1;
        const next = round1(current + delta);

        if (next <= 0) {
            deleteDietEntry(dateStr, entryId);
            return;
        }

        dayObj.entries[entryId].servings = next;
        localStorage.setItem('diet_log_cache', JSON.stringify(dietLogs));
        dietDbRef.child(dateStr).child('entries').child(entryId).child('servings').set(next);

        renderDietTab(document.getElementById('tab-content'));
    }

    function deleteDietEntry(dateStr, entryId) {
        if (dietLogs[dateStr] && dietLogs[dateStr].entries) {
            delete dietLogs[dateStr].entries[entryId];
        }
        localStorage.setItem('diet_log_cache', JSON.stringify(dietLogs));
        dietDbRef.child(dateStr).child('entries').child(entryId).remove();

        renderDietTab(document.getElementById('tab-content'));
    }

    // --- DAILY TECH-NECK TAB ---
    function renderNeckTab(container) {
        const todayStr = new Date().toISOString().split('T')[0];
        const selectedDate = document.getElementById('neck-date-select') ? document.getElementById('neck-date-select').value : todayStr;
        const currentData = neckLogs[selectedDate] || { items: {}, notes: "", completed: 0 };

        // Calculate Streak & Totals
        const allDates = Object.keys(neckLogs).sort();
        const totalDaysDone = allDates.filter(d => neckLogs[d] && neckLogs[d].completed >= 4).length;

        // Calculate progress percentage
        let checkedCount = 0;
        NECK_PROTOCOL.forEach(item => {
            if (currentData.items && currentData.items[item.id]) checkedCount++;
        });
        const percent = Math.round((checkedCount / NECK_PROTOCOL.length) * 100);

        let checklistHtml = "";
        NECK_PROTOCOL.forEach(item => {
            const isChecked = currentData.items && currentData.items[item.id];
            checklistHtml += `
                <div class="neck-item-card ${isChecked ? 'completed' : ''}" onclick="toggleNeckCheck('${selectedDate}', '${item.id}')">
                    <div class="neck-checkbox"></div>
                    <div class="neck-item-content">
                        <span class="neck-item-name">${item.name}</span>
                        <span class="neck-item-cue">${item.cue}</span>
                    </div>
                </div>
            `;
        });

        container.innerHTML = `
            <div class="section-header">
                <div class="section-title">TECH-NECK RESET</div>
                <input type="date" id="neck-date-select" class="session-date-picker" value="${selectedDate}" onchange="renderNeckTab(document.getElementById('tab-content'))">
            </div>

            <div class="dash-metric-grid">
                <div class="dash-metric-card">
                    <div class="metric-label">Today's Progress</div>
                    <div class="metric-value">${percent}%</div>
                    <div class="neck-progress-track">
                        <div class="neck-progress-fill" style="width:${percent}%;"></div>
                    </div>
                </div>
                <div class="dash-metric-card">
                    <div class="metric-label">Completed Sessions</div>
                    <div class="metric-value">${totalDaysDone}</div>
                    <div class="metric-sub">Consistent reset days</div>
                </div>
            </div>

            <div class="card" style="padding:10px 12px; font-size:0.75rem; color:#888; line-height:1.4;">
                <strong style="color:#fff;">Clinical Protocol (3–4 min daily):</strong>
                Perform these 5 drills to pull the cervical spine back over the shoulders, wake up the <em>longus colli</em>, and release suboccipital tension.
            </div>

            <div style="display:flex; flex-direction:column; gap:8px;">
                ${checklistHtml}
            </div>

            <div class="card" style="margin-top:10px;">
                <span class="exercise-name" style="font-size:0.8rem;">Daily Posture Notes</span>
                <input type="text" id="neck-notes-input" class="notes-input" style="width:100%;" placeholder="e.g. traps looser today, chin staying back" value="${currentData.notes || ''}" onblur="saveNeckNotes('${selectedDate}', this.value)">
            </div>
        `;
    }

    function toggleNeckCheck(dateStr, itemId) {
        const currentData = neckLogs[dateStr] || { items: {}, notes: "", completed: 0 };
        if (!currentData.items) currentData.items = {};

        // Toggle state
        currentData.items[itemId] = !currentData.items[itemId];

        // Recalculate completed count
        let count = 0;
        NECK_PROTOCOL.forEach(item => {
            if (currentData.items[item.id]) count++;
        });
        currentData.completed = count;
        currentData.date = dateStr;
        currentData.timestamp = Date.now();

        // Save to Firebase and Local Cache
        neckLogs[dateStr] = currentData;
        localStorage.setItem('neck_log_cache', JSON.stringify(neckLogs));
        neckDbRef.child(dateStr).set(currentData);

        renderNeckTab(document.getElementById('tab-content'));
    }

    function saveNeckNotes(dateStr, notesText) {
        const currentData = neckLogs[dateStr] || { items: {}, notes: "", completed: 0 };
        currentData.notes = notesText;
        currentData.date = dateStr;
        currentData.timestamp = Date.now();

        neckLogs[dateStr] = currentData;
        localStorage.setItem('neck_log_cache', JSON.stringify(neckLogs));
        neckDbRef.child(dateStr).set(currentData);
    }

    // --- BODYWEIGHT TRACKING TAB ---
    function renderWeightTab(container) {
        const sortedLogs = [...bodyweightLog].sort((a, b) => new Date(a.date) - new Date(b.date));

        const weeklyGroups = {};
        sortedLogs.forEach(entry => {
            const d = new Date(entry.date + "T00:00:00");
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff)).toISOString().split('T')[0];

            if (!weeklyGroups[monday]) weeklyGroups[monday] = [];
            weeklyGroups[monday].push(entry.weight);
        });

        const weekKeys = Object.keys(weeklyGroups).sort();
        const weeklyAverages = weekKeys.map(k => {
            const weights = weeklyGroups[k];
            const avg = weights.reduce((a, b) => a + b, 0) / weights.length;
            return { weekStart: k, avg: parseFloat(avg.toFixed(2)) };
        });

        const last7Days = sortedLogs.slice(-7);
        const current7DayAvg = last7Days.length > 0 
            ? (last7Days.reduce((a, b) => a + b.weight, 0) / last7Days.length).toFixed(2)
            : "--";

        let rateDisplay = "--";
        if (weeklyAverages.length >= 2) {
            const latest = weeklyAverages[weeklyAverages.length - 1].avg;
            const prior = weeklyAverages[weeklyAverages.length - 2].avg;
            const diff = latest - prior;
            const sign = diff >= 0 ? "+" : "";
            rateDisplay = `${sign}${diff.toFixed(2)} kg/wk`;
        }

        container.innerHTML = `
            <div class="section-header">
                <div class="section-title">BODYWEIGHT</div>
            </div>

            <div class="dash-metric-grid">
                <div class="dash-metric-card">
                    <div class="metric-label">7-Day Average</div>
                    <div class="metric-value">${current7DayAvg}<span style="font-size:1rem; color:#888;"> kg</span></div>
                    <div class="metric-sub">Smooth rolling average</div>
                </div>
                <div class="dash-metric-card">
                    <div class="metric-label">Weekly Trend</div>
                    <div class="metric-value" style="font-size:1.5rem;">${rateDisplay}</div>
                    <div class="metric-sub">vs previous week</div>
                </div>
            </div>

            <div class="card">
                <div class="card-top">
                    <span class="exercise-name">Log Weigh-In</span>
                    <span class="exercise-target">Daily morning</span>
                </div>
                <div class="weight-input-grid">
                    <input type="date" id="bw-date" class="session-date-picker" value="${new Date().toISOString().split('T')[0]}" style="width:100%;">
                    <input type="number" step="0.1" id="bw-weight" class="num-input" placeholder="kg (e.g. 78.5)">
                    <button class="save-btn" onclick="saveWeightEntry()">Log</button>
                </div>
            </div>

            <div class="chart-card-stacked">
                <div class="chart-card-header">
                    <span class="chart-card-title">Weekly Progression Curve</span>
                    <span class="chart-card-pr">Solid = Avg · Dotted = Daily</span>
                </div>
                <div class="chart-canvas-box" style="height:210px;">
                    <canvas id="bodyweightCanvas"></canvas>
                </div>
            </div>

            <div style="font-size: 0.8rem; font-weight: 600; margin-top: 15px; color: var(--text-secondary);">RECENT WEIGH-INS</div>
            <div class="history-list" id="bw-recent-list"></div>
        `;

        requestAnimationFrame(() => {
            renderWeightChart(sortedLogs, weeklyAverages);
        });

        const listContainer = document.getElementById('bw-recent-list');
        const reversedBw = [...sortedLogs].reverse().slice(0, 10);

        if (reversedBw.length === 0) {
            listContainer.innerHTML = `<div style="color: #444; font-size: 0.75rem;">No weigh-ins logged yet.</div>`;
        } else {
            reversedBw.forEach(item => {
                const row = document.createElement('div');
                row.className = "history-item";
                row.innerHTML = `
                    <div>
                        <strong style="font-size:0.85rem;">${item.weight} kg</strong>
                        <span style="color: #777; font-size: 0.7rem; margin-left:8px;">${item.date}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteWeightEntry('${item.id}')">✕</button>
                `;
                listContainer.appendChild(row);
            });
        }
    }

    function saveWeightEntry() {
        const dateInput = document.getElementById('bw-date').value;
        const weightInput = parseFloat(document.getElementById('bw-weight').value);

        if (!weightInput || isNaN(weightInput)) {
            alert("Please enter a valid weight.");
            return;
        }

        const id = `bw_${dateInput.replace(/-/g, '')}`;
        const newEntry = {
            id: id,
            date: dateInput,
            weight: parseFloat(weightInput.toFixed(2)),
            timestamp: Date.now()
        };

        weightDbRef.child(id).set(newEntry).then(() => {
            document.getElementById('bw-weight').value = "";
        });
    }

    function deleteWeightEntry(id) {
        if (!confirm("Delete this weigh-in entry?")) return;

        bodyweightLog = bodyweightLog.filter(item => String(item.id) !== String(id));
        localStorage.setItem('bw_log_cache', JSON.stringify(bodyweightLog));
        renderWeightTab(document.getElementById('tab-content'));

        weightDbRef.child(id).remove().catch(err => console.error(err));
    }

    function renderWeightChart(dailyLogs, weeklyAverages) {
        const canvas = document.getElementById('bodyweightCanvas');
        if (!canvas) return;

        if (weightChartInstance) {
            try { weightChartInstance.destroy(); } catch(e){}
        }

        const allDates = dailyLogs.map(l => l.date);
        const dailyWeights = dailyLogs.map(l => l.weight);

        const weeklyDataMapped = allDates.map(dateStr => {
            const d = new Date(dateStr + "T00:00:00");
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff)).toISOString().split('T')[0];
            const match = weeklyAverages.find(w => w.weekStart === monday);
            return match ? match.avg : null;
        });

        const labels = allDates.map(d => {
            const parts = d.split('-');
            return `${parts[1]}/${parts[2]}`;
        });

        const displayLabels = labels.length > 0 ? labels : ['D1', 'D2', 'D3', 'D4', 'D5'];
        const displayDaily = dailyWeights.length > 0 ? dailyWeights : [0, 0, 0, 0, 0];
        const displayWeekly = weeklyDataMapped.length > 0 ? weeklyDataMapped : [0, 0, 0, 0, 0];

        const ctx = canvas.getContext('2d');
        weightChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: displayLabels,
                datasets: [
                    {
                        label: 'Weekly Avg',
                        data: displayWeekly,
                        borderColor: '#ffffff',
                        borderWidth: 2.5,
                        backgroundColor: 'transparent',
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointBackgroundColor: '#ffffff',
                        tension: 0.3,
                        spanGaps: true
                    },
                    {
                        label: 'Daily',
                        data: displayDaily,
                        borderColor: 'rgba(255, 255, 255, 0.25)',
                        borderWidth: 1,
                        borderDash: [3, 3],
                        backgroundColor: 'transparent',
                        pointRadius: 3,
                        pointHoverRadius: 5,
                        pointBackgroundColor: '#888888',
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1a1a1a',
                        titleColor: '#888888',
                        bodyColor: '#ffffff',
                        borderColor: '#333333',
                        borderWidth: 1,
                        padding: 8,
                        callbacks: {
                            label: (context) => `${context.dataset.label}: ${context.parsed.y} kg`
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.04)' },
                        ticks: { color: '#555', font: { size: 9 }, maxTicksLimit: 8 }
                    },
                    y: {
                        grid: { 
                            color: 'rgba(255, 255, 255, 0.05)',
                            borderDash: [3, 3] 
                        },
                        ticks: { 
                            color: '#555', 
                            font: { size: 9 },
                            callback: (val) => `${val}kg`
                        }
                    }
                }
            }
        });
    }

    // --- DASHBOARD & STACKED CHARTS ---
    function renderDashboard(container) {
        const totalWorkouts = new Set(trainingLog.map(i => `${i.date}_${i.day}`)).size;
        
        let improvingCount = 0;
        let evaluatedCount = 0;
        
        const allExerciseIds = [];
        Object.values(ROUTINE).forEach(list => list.forEach(ex => allExerciseIds.push(ex.id)));

        allExerciseIds.forEach(id => {
            const logs = trainingLog.filter(l => l.exerciseId === id);
            if (logs.length >= 2) {
                evaluatedCount++;
                const firstWeight = logs[0].weight;
                const lastWeight = logs[logs.length - 1].weight;
                if (lastWeight > firstWeight) improvingCount++;
            }
        });

        const improvingRatio = evaluatedCount > 0 ? `${improvingCount}/${evaluatedCount}` : "0/0";

        const dayExercises = ROUTINE[chartDay] || ROUTINE.LEGS;

        let chartsHtml = "";
        dayExercises.forEach(ex => {
            const exLogs = trainingLog.filter(l => l.exerciseId === ex.id);
            let peak = 0;
            exLogs.forEach(l => { if (l.weight > peak) peak = l.weight; });

            chartsHtml += `
                <div class="chart-card-stacked">
                    <div class="chart-card-header">
                        <span class="chart-card-title">${ex.name}</span>
                        <span class="chart-card-pr">${peak > 0 ? 'Peak: ' + peak + ' kg' : 'No logs yet'}</span>
                    </div>
                    <div class="chart-canvas-box">
                        <canvas id="canvas_${ex.id}"></canvas>
                    </div>
                </div>
            `;
        });

        container.innerHTML = `
            <div class="section-header">
                <div class="section-title">PROGRESSION</div>
            </div>

            <div class="dash-metric-grid">
                <div class="dash-metric-card">
                    <div class="metric-label">Workouts completed</div>
                    <div class="metric-value">${totalWorkouts}</div>
                </div>
                <div class="dash-metric-card">
                    <div class="metric-label">Exercises improving</div>
                    <div class="metric-value">${improvingRatio}</div>
                </div>
            </div>

            <!-- Day Toggle Bar for Stacked Charts: 4 Days -->
            <div class="day-toggle-bar">
                <button class="day-toggle-btn ${chartDay === 'LEGS' ? 'active' : ''}" onclick="selectChartDay('LEGS')">LEGS</button>
                <button class="day-toggle-btn ${chartDay === 'PUSH' ? 'active' : ''}" onclick="selectChartDay('PUSH')">PUSH</button>
                <button class="day-toggle-btn ${chartDay === 'PULL' ? 'active' : ''}" onclick="selectChartDay('PULL')">PULL</button>
                <button class="day-toggle-btn ${chartDay === 'REC' ? 'active' : ''}" onclick="selectChartDay('REC')">REC</button>
            </div>

            <div class="stacked-charts-wrapper">
                ${chartsHtml}
            </div>

            <div style="font-size: 0.8rem; font-weight: 600; margin-top: 25px; color: var(--text-secondary);">RECENT ACTIVITY</div>
            <div class="history-list" id="recent-list"></div>
        `;

        requestAnimationFrame(() => {
            renderStackedChartsForDay(dayExercises);
        });

        const recentContainer = document.getElementById('recent-list');
        const reversedLog = [...trainingLog].reverse().slice(0, 8);

        if (reversedLog.length === 0) {
            recentContainer.innerHTML = `<div style="color: #444; font-size: 0.75rem;">No workouts completed yet.</div>`;
        } else {
            reversedLog.forEach(item => {
                const summary = formatPreviousLog(item);
                const row = document.createElement('div');
                row.className = "history-item";
                row.innerHTML = `
                    <div>
                        <div style="font-weight: 600;">${item.exerciseId.toUpperCase()}</div>
                        <div style="color: #777; font-size: 0.65rem;">${item.date} · ${summary}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteEntry('${item.id}')">✕</button>
                `;
                recentContainer.appendChild(row);
            });
        }
    }

    function selectChartDay(day) {
        chartDay = day;
        renderDashboard(document.getElementById('tab-content'));
    }

    function renderStackedChartsForDay(exercises) {
        activeChartInstances.forEach(inst => {
            try { inst.destroy(); } catch(e){}
        });
        activeChartInstances = [];

        exercises.forEach(ex => {
            const canvas = document.getElementById(`canvas_${ex.id}`);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const exLogs = trainingLog
                .filter(l => l.exerciseId === ex.id)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            const labels = exLogs.map((l, idx) => {
                const parts = l.date.split('-');
                if (parts.length === 3) return `S${idx + 1} (${parts[1]}/${parts[2]})`;
                return `S${idx + 1}`;
            });
            const dataPoints = exLogs.map(l => l.weight);

            const displayLabels = labels.length > 0 ? labels : ['S1', 'S2', 'S3', 'S4'];
            const displayData = dataPoints.length > 0 ? dataPoints : [0, 0, 0, 0];

            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: displayLabels,
                    datasets: [{
                        label: 'Top Set (kg)',
                        data: displayData,
                        borderColor: '#ffffff',
                        backgroundColor: 'rgba(255, 255, 255, 0.04)',
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#141414',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        tension: 0.15,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1a1a1a',
                            titleColor: '#888888',
                            bodyColor: '#ffffff',
                            borderColor: '#333333',
                            borderWidth: 1,
                            padding: 8,
                            displayColors: false,
                            callbacks: {
                                label: (context) => `${context.parsed.y} kg`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.04)' },
                            ticks: { color: '#555', font: { size: 9 } }
                        },
                        y: {
                            grid: { 
                                color: 'rgba(255, 255, 255, 0.05)',
                                borderDash: [3, 3] 
                            },
                            ticks: { 
                                color: '#555', 
                                font: { size: 9 },
                                callback: (val) => `${val}kg`
                            }
                        }
                    }
                }
            });

            activeChartInstances.push(chart);
        });
    }

    function deleteEntry(id, showConfirm = true) {
        if (showConfirm && !confirm("Delete this log entry?")) return;

        trainingLog = trainingLog.filter(item => String(item.id) !== String(id));
        localStorage.setItem('workout_log_cache', JSON.stringify(trainingLog));
        renderTabContent();

        if (id && id !== 'undefined') {
            workoutDbRef.child(id).remove().then(() => {
                document.getElementById('sync-status').textContent = "Synced";
            }).catch(err => {
                console.error("Firebase delete error:", err);
            });
        }
    }

    window.onload = renderTabContent;
</script>
</body>
</html>
