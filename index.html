<!DOCTYPE html>
<html lang="en" style="background-color: #0a0a0a; color-scheme: dark;">
<head>
    <meta name="color-scheme" content="dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>LPP Power & Hypertrophy Tracker</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-color: #0a0a0a;
            --surface-color: #141414;
            --surface-border: #222222;
            --text-primary: #f0f0f0;
            --text-secondary: #777777;
            --accent-gold: #f1c40f;
            --accent-green: #2ecc71;
            --danger: #e74c3c;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background-color: var(--bg-color); color: var(--text-primary); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
        }
        .lock-input {
            background: #111; border: 1px solid #333; color: white;
            padding: 15px; border-radius: 8px; text-align: center;
            font-size: 1.5rem; outline: none; width: 140px; letter-spacing: 5px;
        }
        .hidden { display: none !important; }

        .app-container {
            width: 100%; max-width: 520px; padding: 16px 14px 100px 14px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .tabs-nav {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
            background: var(--surface-color); padding: 4px; border-radius: 10px;
            border: 1px solid var(--surface-border); position: sticky; top: 10px; z-index: 50;
        }
        .tab-btn {
            background: transparent; border: none; color: var(--text-secondary);
            padding: 9px 0; border-radius: 7px; font-weight: 700; font-size: 0.75rem;
            cursor: pointer; text-align: center; transition: 0.2s;
        }
        .tab-btn.active { background: #262626; color: #fff; }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 8px; border-bottom: 1px solid var(--surface-border);
        }
        .section-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
        .session-date-picker {
            background: transparent; border: 1px solid var(--surface-border);
            color: var(--text-secondary); font-size: 0.8rem; border-radius: 6px; padding: 4px 8px;
        }

        .card {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
        }
        .card-top { display: flex; justify-content: space-between; align-items: baseline; }
        .exercise-name { font-size: 0.95rem; font-weight: 600; margin: 0; }
        .exercise-target { font-size: 0.7rem; color: var(--accent-gold); text-transform: uppercase; font-weight: 600; }
        
        .prev-reference {
            background: #090909; border-radius: 6px; padding: 6px 10px;
            font-size: 0.75rem; color: var(--text-secondary); display: flex; justify-content: space-between;
        }
        .prev-data { color: #aaa; font-family: monospace; font-size: 0.8rem; }

        .set-inputs-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 6px;
        }
        .input-group { display: flex; flex-direction: column; gap: 3px; }
        .input-label { font-size: 0.6rem; text-transform: uppercase; color: var(--text-secondary); text-align: center; }
        .num-input {
            width: 100%; background: #080808; border: 1px solid #2a2a2a; border-radius: 6px;
            color: #fff; padding: 8px 0; text-align: center; font-size: 0.95rem; font-weight: 600;
            outline: none;
        }
        .num-input:focus { border-color: #666; }

        .card-actions { display: flex; gap: 8px; align-items: center; }
        .notes-input {
            flex-grow: 1; background: #080808; border: 1px solid #222; border-radius: 6px;
            color: #bbb; padding: 8px 10px; font-size: 0.75rem; outline: none;
        }
        .save-btn {
            background: #ffffff; color: #000; border: none; font-weight: 700;
            font-size: 0.75rem; padding: 8px 14px; border-radius: 6px; cursor: pointer;
        }

        .dash-metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .dash-metric-card {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            padding: 14px; border-radius: 10px; text-align: center;
        }
        .metric-value { font-size: 2rem; font-weight: 200; margin: 2px 0; }
        .metric-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); }

        .history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .history-item {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            border-radius: 8px; padding: 10px 12px; font-size: 0.75rem;
            display: flex; justify-content: space-between; align-items: center;
        }

        .cloud-badge {
            font-size: 0.65rem; color: var(--accent-green); display: flex;
            align-items: center; gap: 4px; font-weight: 600;
        }
    </style>
</head>
<body>

<!-- Unlock screen (Pin: 2) -->
<div id="lock-screen">
    <input type="password" id="pass-input" class="lock-input" placeholder="•" autofocus oninput="checkPass(this.value)">
</div>

<div id="app-container" class="hidden app-container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:0.75rem; font-weight:700; letter-spacing:0.05em; color:var(--text-secondary);">POWER & HYPERTROPHY</span>
        <span id="sync-status" class="cloud-badge">☁️ Connected</span>
    </div>

    <!-- Navigation -->
    <nav class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('LEGS')">LEGS</button>
        <button class="tab-btn" onclick="switchTab('PUSH')">PUSH</button>
        <button class="tab-btn" onclick="switchTab('PULL')">PULL</button>
        <button class="tab-btn" onclick="switchTab('DASH')">STATS</button>
    </nav>

    <!-- Content Area -->
    <div id="tab-content"></div>
</div>

<!-- Firebase SDK (Uses identical version to your trading tracker) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // --- FIREBASE CONFIG (Connected to journal-a003f) ---
    const firebaseConfig = {
        apiKey: "AIzaSyCQ4vHqGiv_yRkA0zZaaOU24gxhqBkxnv4",
        authDomain: "journal-a003f.firebaseapp.com",
        databaseURL: "https://journal-a003f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "journal-a003f",
        storageBucket: "journal-a003f.firebasestorage.app",
        messagingSenderId: "1038636626553",
        appId: "1:1038636626553:web:7a91c321e39c146bdc9aa8"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // STRICT NAMESPACE: Everything in this tracker is isolated in /workout_tracker
    // It will NEVER touch /trades, /ts_trades, /completed_trades, etc.
    const workoutDbRef = database.ref('workout_tracker/logs');

    // --- PIN LOCK ---
    function checkPass(val) {
        if (val === "2") {
            const ls = document.getElementById('lock-screen');
            ls.style.opacity = '0';
            setTimeout(() => {
                ls.classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
            }, 300);
        }
    }

    // --- ROUTINE DEFINITION ---
    const ROUTINE = {
        LEGS: [
            { id: "squat", name: "Barbell Back Squat", target: "3 × 6–8 reps" },
            { id: "rdl", name: "Barbell Romanian Deadlift", target: "3 × 8–10 reps" },
            { id: "calf_core", name: "Standing Calf + Deadbug", target: "2 × 15 / 10 side" },
            { id: "swings", name: "2-Hand KB Swings (Finisher)", target: "5 × 10 EMOM (50 reps)" }
        ],
        PUSH: [
            { id: "kb_push_press", name: "KB Push Press (Power Primer)", target: "3 × 5 / side (Snappy)" },
            { id: "ohp", name: "Standing Barbell OHP", target: "3 × 6–8 reps" },
            { id: "pushups", name: "Deep Parallette Push-ups", target: "3 × 8–12 reps" },
            { id: "lateral_raises", name: "Dumbbell Lateral Raises", target: "2 × 12–15 reps" },
            { id: "tricep_ext", name: "Overhead KB Triceps Ext", target: "2 × 10–12 reps" }
        ],
        PULL: [
            { id: "high_pulls", name: "1-Arm KB High Pulls (Power)", target: "3 × 5 / side (Fast)" },
            { id: "chins", name: "Chin-ups / Band Assisted", target: "3 × 5–8 reps" },
            { id: "pendlay", name: "Barbell Pendlay Row", target: "3 × 6–8 reps" },
            { id: "rear_delt", name: "Dumbbell Rear-Delt Fly", target: "2 × 12–15 reps" },
            { id: "curls", name: "Barbell / DB Bicep Curls", target: "2 × 8–12 reps" }
        ]
    };

    let currentTab = "LEGS";
    let trainingLog = JSON.parse(localStorage.getItem('workout_log_cache')) || [];

    // --- REALTIME SYNC LISTENER ---
    workoutDbRef.on('value', snapshot => {
        const data = snapshot.val();
        if (data) {
            trainingLog = Object.values(data);
            localStorage.setItem('workout_log_cache', JSON.stringify(trainingLog));
            renderTabContent();
            document.getElementById('sync-status').textContent = "☁️ Synced";
        }
    });

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === tab || (tab === 'DASH' && btn.innerText === 'STATS'));
        });
        renderTabContent();
    }

    function getFormattedToday() {
        return new Date().toISOString().split('T')[0];
    }

    function renderTabContent() {
        const container = document.getElementById('tab-content');
        container.innerHTML = "";

        if (currentTab === "DASH") {
            renderDashboard(container);
            return;
        }

        const header = document.createElement('div');
        header.className = "section-header";
        header.innerHTML = `
            <div class="section-title">${currentTab} SESSION</div>
            <input type="date" id="session-date" class="session-date-picker" value="${getFormattedToday()}">
        `;
        container.appendChild(header);

        ROUTINE[currentTab].forEach(exercise => {
            const card = document.createElement('div');
            card.className = "card";

            const history = trainingLog.filter(item => item.exerciseId === exercise.id);
            const prev = history.length > 0 ? history[history.length - 1] : null;
            const prevDisplay = prev 
                ? `${prev.weight}kg · [${prev.s1}, ${prev.s2}, ${prev.s3 || '-'}] · RIR ${prev.rir}`
                : "No entries logged yet";

            card.innerHTML = `
                <div class="card-top">
                    <h4 class="exercise-name">${exercise.name}</h4>
                    <span class="exercise-target">${exercise.target}</span>
                </div>

                <div class="prev-reference">
                    <span>Last:</span>
                    <span class="prev-data">${prevDisplay}</span>
                </div>

                <div class="set-inputs-grid">
                    <div class="input-group">
                        <span class="input-label">Weight</span>
                        <input type="number" step="0.5" id="w_${exercise.id}" class="num-input" placeholder="${prev ? prev.weight : 'kg'}">
                    </div>
                    <div class="input-group">
                        <span class="input-label">Set 1</span>
                        <input type="number" id="s1_${exercise.id}" class="num-input" placeholder="reps">
                    </div>
                    <div class="input-group">
                        <span class="input-label">Set 2</span>
                        <input type="number" id="s2_${exercise.id}" class="num-input" placeholder="reps">
                    </div>
                    <div class="input-group">
                        <span class="input-label">Set 3</span>
                        <input type="number" id="s3_${exercise.id}" class="num-input" placeholder="reps">
                    </div>
                    <div class="input-group">
                        <span class="input-label">RIR</span>
                        <input type="number" id="rir_${exercise.id}" class="num-input" placeholder="0-3">
                    </div>
                </div>

                <div class="card-actions">
                    <input type="text" id="notes_${exercise.id}" class="notes-input" placeholder="Notes (optional)">
                    <button class="save-btn" onclick="saveEntry('${exercise.id}')">Log</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function saveEntry(exerciseId) {
        const date = document.getElementById('session-date').value;
        const weight = parseFloat(document.getElementById(`w_${exerciseId}`).value) || 0;
        const s1 = parseInt(document.getElementById(`s1_${exerciseId}`).value) || 0;
        const s2 = parseInt(document.getElementById(`s2_${exerciseId}`).value) || 0;
        const s3 = parseInt(document.getElementById(`s3_${exerciseId}`).value) || 0;
        const rir = document.getElementById(`rir_${exerciseId}`).value || "-";
        const notes = document.getElementById(`notes_${exerciseId}`).value;

        if (!s1 && !s2 && !weight) {
            alert("Please input at least weight and reps before logging.");
            return;
        }

        const logId = `entry_${Date.now()}`;
        const newLog = {
            id: logId,
            date: date,
            day: currentTab,
            exerciseId: exerciseId,
            weight: weight,
            s1: s1,
            s2: s2,
            s3: s3,
            rir: rir,
            notes: notes
        };

        // Writes specifically to /workout_tracker/logs/{logId}
        workoutDbRef.child(logId).set(newLog);
    }

    function renderDashboard(container) {
        const totalWorkouts = new Set(trainingLog.map(i => `${i.date}_${i.day}`)).size;

        container.innerHTML = `
            <div class="section-header">
                <div class="section-title">PROGRESSION STATS</div>
            </div>

            <div class="dash-metric-grid">
                <div class="dash-metric-card">
                    <div class="metric-value">${totalWorkouts}</div>
                    <div class="metric-label">Completed Sessions</div>
                </div>
                <div class="dash-metric-card">
                    <div class="metric-value">${trainingLog.length}</div>
                    <div class="metric-label">Logged Exercises</div>
                </div>
            </div>

            <div style="font-size: 0.8rem; font-weight: 700; margin-top: 15px; color: var(--text-secondary);">ESTIMATED STRENGTH PEAKS</div>
            <div class="history-list" id="peaks-list"></div>

            <div style="font-size: 0.8rem; font-weight: 700; margin-top: 15px; color: var(--text-secondary);">RECENT ACTIVITY</div>
            <div class="history-list" id="recent-list"></div>
        `;

        const trackedLifts = [
            { id: "squat", name: "Back Squat" },
            { id: "ohp", name: "Overhead Press" },
            { id: "pendlay", name: "Pendlay Row" },
            { id: "rdl", name: "Romanian Deadlift" }
        ];

        const peaksContainer = document.getElementById('peaks-list');
        trackedLifts.forEach(lift => {
            const records = trainingLog.filter(l => l.exerciseId === lift.id);
            let maxWeight = 0;
            records.forEach(r => { if (r.weight > maxWeight) maxWeight = r.weight; });

            const row = document.createElement('div');
            row.className = "history-item";
            row.innerHTML = `
                <span>${lift.name}</span>
                <strong style="color: var(--accent-gold);">${maxWeight > 0 ? maxWeight + ' kg' : '—'}</strong>
            `;
            peaksContainer.appendChild(row);
        });

        const recentContainer = document.getElementById('recent-list');
        const reversedLog = [...trainingLog].reverse().slice(0, 8);

        if (reversedLog.length === 0) {
            recentContainer.innerHTML = `<div style="color: #444; font-size: 0.75rem;">No workouts completed yet.</div>`;
        } else {
            reversedLog.forEach(item => {
                const row = document.createElement('div');
                row.className = "history-item";
                row.innerHTML = `
                    <div>
                        <div style="font-weight: 600;">${item.exerciseId.toUpperCase()} · ${item.weight}kg</div>
                        <div style="color: #666; font-size: 0.65rem;">${item.date} · Reps: ${item.s1}/${item.s2}/${item.s3} (RIR ${item.rir})</div>
                    </div>
                    <button style="background:transparent; border:none; color: var(--danger); cursor:pointer;" onclick="deleteEntry('${item.id}')">✕</button>
                `;
                recentContainer.appendChild(row);
            });
        }
    }

    function deleteEntry(id) {
        if (confirm("Delete this log entry?")) {
            workoutDbRef.child(id).remove();
        }
    }

    window.onload = renderTabContent;
</script>
</body>
</html>
