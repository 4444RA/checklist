
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Progress</title>
    <style>
        :root {
            --bg-color: #121212;      /* Deep Matte Grey */
            --text-primary: #e0e0e0;  /* Off-white */
            --text-secondary: #757575; /* Muted Grey */
            --bar-track: #2a2a2a;     /* Darker track */
            --bar-fill: #ffffff;      /* High contrast fill */
            --box-border: #333;
            --box-checked: #ffffff;
            --today-highlight: #4a4a4a; /* Subtle highlight for current day */
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            letter-spacing: -0.01em;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }

        /* Typography */
        .year-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .percentage-display {
            font-size: 5rem;
            font-weight: 300;
            margin: 0;
            line-height: 1;
            color: var(--text-primary);
        }

        .percentage-display span {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-left: 2px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: var(--bar-track);
            border-radius: 2px;
            margin: 2.5rem 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--bar-fill);
            transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Info */
        .footer-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .current-date {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-bottom: 1px solid #222;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        /* Checklist Grid */
        .month-group {
            text-align: left;
            margin-bottom: 24px;
        }

        .month-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 10px;
            letter-spacing: 0.15em;
            font-weight: 600;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(22px, 1fr));
            gap: 6px;
        }

        .day-checkbox {
            width: 24px;
            height: 24px;
            border: 1px solid var(--box-border);
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            user-select: none;
        }

        .day-checkbox:hover {
            border-color: #666;
        }

        .day-checkbox.checked {
            background-color: var(--box-checked);
            border-color: var(--box-checked);
            color: #000; /* Dark text when checked for contrast */
            font-weight: bold;
        }

        /* Highlight the specific current day box */
        .day-checkbox.is-today {
            border-color: #888;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.1);
            background-color: rgba(255,255,255,0.05);
        }

        /* Fade-in Animation */
        .wrapper {
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="year-label" id="year-text">----</div>
        <h1 class="percentage-display"><span id="percentage">0</span><span>%</span></h1>

        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="footer-info">
            <span>Day <span id="days-passed">0</span></span>
            <span><span id="days-remaining">0</span> days left</span>
        </div>

        <div class="current-date" id="full-date">---</div>

        <div id="calendar-root"></div>
    </div>

    <script>
        function init() {
            const now = new Date();
            const year = now.getFullYear();
            const currentMonth = now.getMonth();
            const currentDate = now.getDate();
            
            // Calculate year progress
            const start = new Date(year, 0, 1);
            const end = new Date(year + 1, 0, 1);
            const totalMs = end - start;
            const passedMs = now - start;
            
            const totalDays = Math.floor(totalMs / (1000 * 60 * 60 * 24));
            const daysPassed = Math.floor(passedMs / (1000 * 60 * 60 * 24)) + 1;
            const daysRemaining = totalDays - daysPassed;
            
            const percent = ((daysPassed / totalDays) * 100).toFixed(1);

            // Update Header
            document.getElementById('year-text').innerText = year;
            document.getElementById('percentage').innerText = percent;
            document.getElementById('days-passed').innerText = daysPassed;
            document.getElementById('days-remaining').innerText = daysRemaining;
            document.getElementById('full-date').innerText = now.toLocaleDateString(undefined, { 
                weekday: 'long', 
                month: 'long', 
                day: 'numeric' 
            });

            // Animate progress bar
            setTimeout(() => {
                document.getElementById('progress-fill').style.width = percent + '%';
            }, 300);

            // Build Checklist
            generateChecklist(year, currentMonth, currentDate);
        }

        function generateChecklist(year, currentMonth, currentDate) {
            const root = document.getElementById('calendar-root');
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            months.forEach((monthName, monthIdx) => {
                const monthGroup = document.createElement('div');
                monthGroup.className = 'month-group';
                
                const title = document.createElement('div');
                title.className = 'month-title';
                title.innerText = monthName;
                
                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';
                
                const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
                
                for (let d = 1; d <= daysInMonth; d++) {
                    const dayBox = document.createElement('div');
                    dayBox.className = 'day-checkbox';
                    dayBox.innerText = d; // Add the day number
                    
                    const storageKey = `checked-${year}-${monthIdx}-${d}`;
                    
                    // Mark if today
                    if (monthIdx === currentMonth && d === currentDate) {
                        dayBox.classList.add('is-today');
                    }

                    // Load state
                    if (localStorage.getItem(storageKey) === 'true') {
                        dayBox.classList.add('checked');
                    }
                    
                    dayBox.onclick = () => {
                        const isChecked = dayBox.classList.toggle('checked');
                        localStorage.setItem(storageKey, isChecked);
                    };
                    
                    daysGrid.appendChild(dayBox);
                }
                
                monthGroup.appendChild(title);
                monthGroup.appendChild(daysGrid);
                root.appendChild(monthGroup);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
