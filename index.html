<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Year Progress & Journal</title>
<style>
:root{
--bg:#09090B;
--surface:#111114;
--surface2:#18181C;
--text:#FAFAFA;
--muted:#8A8A95;
--border:rgba(255,255,255,.08);
--success:#22C55E;
--blue:#4F8CFF;
--purple:#A855F7;
--red:#FF5F45;
--green:#22C55E;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
background:
radial-gradient(circle at top, rgba(255,255,255,.04), transparent 40%),
linear-gradient(180deg,#0b0b0e,#09090b);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
}
.main-content{display:flex;justify-content:center}
.wrapper{width:100%;max-width:620px;padding:60px 24px}
.percentage-display{
font-size:7rem;font-weight:800;letter-spacing:-.06em;
margin:0;text-align:center;
background:linear-gradient(180deg,#fff,#bfbfbf);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.progress-container{height:10px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin:30px 0}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#fff,#d0d0d0);transition:width 1.2s ease}
.current-date{text-align:center;color:var(--muted);margin-bottom:20px}
.stats-card,.month-group{
background:rgba(255,255,255,.03);
border:1px solid var(--border);
border-radius:20px;
backdrop-filter:blur(20px);
}
.stats-card{padding:22px;margin-bottom:25px;text-align:center}
.stats-label{font-size:.75rem;letter-spacing:.2em;color:var(--muted)}
.stats-value{font-size:2rem;font-weight:700;margin-top:8px}
.month-group{padding:18px;margin-bottom:22px}
.month-title{font-size:.75rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.days-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:8px}
.day-checkbox{
width:32px;height:32px;border-radius:10px;border:1px solid var(--border);
background:#131317;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
overflow:hidden;position:relative;cursor:pointer;transition:.15s;
}
.day-checkbox:hover{transform:translateY(-2px)}
.day-checkbox.is-today{box-shadow:0 0 0 1px var(--success),0 0 16px rgba(34,197,94,.25)}
.q{opacity:0}
.q.active{opacity:1}
.q-0{background:var(--blue)}
.q-1{background:var(--purple)}
.q-2{background:var(--red)}
.q-3{background:var(--green)}
.day-number{
position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
font-size:10px;font-weight:700;color:white;text-shadow:0 1px 3px black
}
.zoom-controls{position:fixed;top:20px;left:20px;display:flex;gap:10px;z-index:10}
.zoom-btn{
background:#18181c;color:white;border:1px solid var(--border);
padding:8px 14px;border-radius:12px;cursor:pointer
}
.zoom-btn.active{border-color:white}
.wrapper.x2{transform:scale(2);transform-origin:top center;margin-bottom:120vh}
.journal-panel{
position:fixed;right:-420px;top:0;width:420px;height:100vh;
background:rgba(15,15,18,.85);backdrop-filter:blur(30px);
border-left:1px solid var(--border);
padding:30px;transition:right .35s ease;display:flex;flex-direction:column;
}
.journal-panel.open{right:0}
.journal-header{font-size:1.4rem;font-weight:700;margin-bottom:20px}
.habit-item{
display:flex;align-items:center;padding:10px 12px;
background:rgba(255,255,255,.03);border:1px solid var(--border);
border-radius:12px;margin-bottom:10px
}
textarea{
flex:1;margin-top:20px;background:rgba(255,255,255,.03);
border:1px solid var(--border);border-radius:18px;color:white;
padding:20px;resize:none
}
.close-btn{position:absolute;right:20px;top:20px;cursor:pointer}
</style>
</head>
<body id="body-root">

<div class="zoom-controls">
<button class="zoom-btn active" id="btn-1x" onclick="setZoom(1)">1x</button>
<button class="zoom-btn" id="btn-2x" onclick="setZoom(2)">2x</button>
</div>

<div class="main-content">
<div class="wrapper" id="main-wrapper">
<h1 class="percentage-display"><span id="percentage">0</span>%</h1>
<div class="progress-container"><div class="progress-fill" id="progress-fill"></div></div>
<div class="current-date" id="full-date">---</div>
<div class="stats-card">
<div class="stats-label">YEAR REMAINING</div>
<div class="stats-value" id="days-remaining">0 Days</div>
</div>
<div id="calendar-root"></div>
</div>
</div>

<div class="journal-panel" id="journal-panel">
<div class="close-btn" onclick="closeJournal()">✕</div>
<div class="journal-header" id="journal-date-title">Date</div>
<div id="habit-checklist">
<label class="habit-item"><input type="checkbox" data-habit="0"> Meditate</label>
<label class="habit-item"><input type="checkbox" data-habit="1"> Yoga</label>
<label class="habit-item"><input type="checkbox" data-habit="2"> Workout</label>
<label class="habit-item"><input type="checkbox" data-habit="3"> Walk</label>
</div>
<textarea id="journal-text" placeholder="Write about your day..."></textarea>
</div>

<script>
let currentEditingKey=null;
const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
function getPerthTime(){
const now=new Date();
const f=new Intl.DateTimeFormat('en-US',{timeZone:'Australia/Perth',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hour12:false});
const p=f.formatToParts(now),d={};p.forEach(x=>d[x.type]=x.value);
return new Date(d.year,d.month-1,d.day,d.hour,d.minute,d.second);
}
function setZoom(scale){
const w=document.getElementById('main-wrapper');
document.getElementById('btn-1x').classList.toggle('active',scale===1);
document.getElementById('btn-2x').classList.toggle('active',scale===2);
w.className=scale===2?'wrapper x2':'wrapper';
}
function init(){
const now=getPerthTime();
const year=now.getFullYear();
const start=new Date(year,0,1);
const end=new Date(year+1,0,1);
const total=Math.floor((end-start)/86400000);
const passed=Math.floor((now-start)/86400000)+1;
const percent=((passed/total)*100).toFixed(1);
percentage.innerText=percent;
document.getElementById("days-remaining").innerText=(total-passed)+" Days";
document.getElementById('full-date').innerText=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'Australia/Perth'}).format(new Date());
setTimeout(()=>progress-fill.style.width=percent+'%',300);
generateChecklist(year,now.getMonth(),now.getDate());
setupJournalListeners();
}
function generateChecklist(year,currentMonth,currentDate){
const root=document.getElementById('calendar-root'); root.innerHTML='';
months.forEach((monthName,monthIdx)=>{
const group=document.createElement('div'); group.className='month-group';
group.innerHTML='<div class="month-title">'+monthName+'</div>';
const grid=document.createElement('div'); grid.className='days-grid';
const days=new Date(year,monthIdx+1,0).getDate();
for(let d=1;d<=days;d++){
const key=`${year}-${monthIdx}-${d}`;
const box=document.createElement('div'); box.className='day-checkbox'; box.id='day-'+key;
for(let i=0;i<4;i++){const q=document.createElement('div');q.className='q q-'+i;box.appendChild(q);}
const num=document.createElement('div');num.className='day-number';num.innerText=d;box.appendChild(num);
if(monthIdx===currentMonth&&d===currentDate)box.classList.add('is-today');
updateBoxVisuals(box,key);
box.onclick=()=>openJournal(key,monthName,d);
grid.appendChild(box);
}
group.appendChild(grid); root.appendChild(group);
});
}
function openJournal(key,month,day){
currentEditingKey=key;
const data=JSON.parse(localStorage.getItem(key))||{text:"",habits:[false,false,false,false]};
document.getElementById('journal-date-title').innerText=`${month} ${day}`;
document.getElementById('journal-text').value=data.text;
document.querySelectorAll('#habit-checklist input').forEach((c,i)=>c.checked=data.habits[i]);
document.getElementById('journal-panel').classList.add('open');
}
function closeJournal(){document.getElementById('journal-panel').classList.remove('open');}
function setupJournalListeners(){
const text=document.getElementById('journal-text');
const habits=document.querySelectorAll('#habit-checklist input');
const save=()=>{
if(!currentEditingKey)return;
const vals=[...habits].map(c=>c.checked);
localStorage.setItem(currentEditingKey,JSON.stringify({text:text.value,habits:vals}));
updateBoxVisuals(document.getElementById('day-'+currentEditingKey),currentEditingKey);
};
text.oninput=save; habits.forEach(c=>c.onchange=save);
}
function updateBoxVisuals(el,key){
if(!el)return;
const data=JSON.parse(localStorage.getItem(key));
el.querySelectorAll('.q').forEach((q,i)=>q.classList.toggle('active',data&&data.habits&&data.habits[i]));
}
window.onload=init;
</script>
</body>
</html>
