
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Progress</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-primary: #e0e0e0;
            --text-secondary: #757575;
            --bar-track: #2a2a2a;
            --bar-fill: #ffffff;
            --box-border: #333;
            --box-checked: #ffffff;
            --today-border: #888;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Zoom Control Button */
        .zoom-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .zoom-btn {
            background: #222;
            border: 1px solid #444;
            color: var(--text-secondary);
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s;
        }

        .zoom-btn.active {
            color: #fff;
            border-color: #fff;
            background: #333;
        }

        /* Main Wrapper */
        .wrapper {
            width: 100%;
            max-width: 450px;
            padding: 60px 20px;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            transform-origin: top center;
        }

        /* 2x Scale logic */
        .wrapper.x2 {
            transform: scale(2);
            margin-bottom: 120vh; /* Adds space so user can scroll to bottom when scaled */
        }

        /* Typography */
        .year-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .percentage-display {
            font-size: 5rem;
            font-weight: 300;
            margin: 0;
            line-height: 1;
        }

        .percentage-display span {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-left: 2px;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: var(--bar-track);
            border-radius: 2px;
            margin: 2.5rem 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--bar-fill);
            transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .footer-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .current-date {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-bottom: 1px solid #222;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        /* Checklist */
        .month-group {
            text-align: left;
            margin-bottom: 24px;
        }

        .month-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 10px;
            letter-spacing: 0.15em;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(22px, 1fr));
            gap: 6px;
        }

        .day-checkbox {
            width: 24px;
            height: 24px;
            border: 1px solid var(--box-border);
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            user-select: none;
            background: transparent;
        }

        /* Focus on Today */
        .day-checkbox.is-today {
            border-color: var(--today-border);
            border-width: 1.5px;
        }

        /* Focus on Checked (highest priority) */
        .day-checkbox.checked {
            background-color: var(--box-checked) !important;
            border-color: var(--box-checked) !important;
            color: #000 !important;
            font-weight: bold;
        }

        .day-checkbox:hover {
            border-color: #666;
        }

        /* Fade-in Animation */
        .wrapper {
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="zoom-controls">
        <button class="zoom-btn active" id="btn-1x" onclick="setZoom(1)">1x</button>
        <button class="zoom-btn" id="btn-2x" onclick="setZoom(2)">2x</button>
    </div>

    <div class="wrapper" id="main-wrapper">
        <div class="year-label" id="year-text">----</div>
        <h1 class="percentage-display"><span id="percentage">0</span><span>%</span></h1>

        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="footer-info">
            <span>Day <span id="days-passed">0</span></span>
            <span><span id="days-remaining">0</span> days left</span>
        </div>

        <div class="current-date" id="full-date">---</div>

        <div id="calendar-root"></div>
    </div>

    <script>
        function setZoom(scale) {
            const wrapper = document.getElementById('main-wrapper');
            const btn1 = document.getElementById('btn-1x');
            const btn2 = document.getElementById('btn-2x');

            if (scale === 2) {
                wrapper.classList.add('x2');
                btn2.classList.add('active');
                btn1.classList.remove('active');
            } else {
                wrapper.classList.remove('x2');
                btn1.classList.add('active');
                btn2.classList.remove('active');
            }
        }

        function init() {
            const now = new Date();
            const year = now.getFullYear();
            const currentMonth = now.getMonth();
            const currentDate = now.getDate();
            
            const start = new Date(year, 0, 1);
            const end = new Date(year + 1, 0, 1);
            const totalMs = end - start;
            const passedMs = now - start;
            
            const totalDays = Math.floor(totalMs / (1000 * 60 * 60 * 24));
            const daysPassed = Math.floor(passedMs / (1000 * 60 * 60 * 24)) + 1;
            const daysRemaining = totalDays - daysPassed;
            const percent = ((daysPassed / totalDays) * 100).toFixed(1);

            document.getElementById('year-text').innerText = year;
            document.getElementById('percentage').innerText = percent;
            document.getElementById('days-passed').innerText = daysPassed;
            document.getElementById('days-remaining').innerText = daysRemaining;
            document.getElementById('full-date').innerText = now.toLocaleDateString(undefined, { 
                weekday: 'long', month: 'long', day: 'numeric' 
            });

            setTimeout(() => {
                document.getElementById('progress-fill').style.width = percent + '%';
            }, 300);

            generateChecklist(year, currentMonth, currentDate);
        }

        function generateChecklist(year, currentMonth, currentDate) {
            const root = document.getElementById('calendar-root');
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            months.forEach((monthName, monthIdx) => {
                const monthGroup = document.createElement('div');
                monthGroup.className = 'month-group';
                
                const title = document.createElement('div');
                title.className = 'month-title';
                title.innerText = monthName;
                
                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';
                
                const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
                
                for (let d = 1; d <= daysInMonth; d++) {
                    const dayBox = document.createElement('div');
                    dayBox.className = 'day-checkbox';
                    dayBox.innerText = d;
                    
                    const storageKey = `checked-${year}-${monthIdx}-${d}`;
                    
                    if (monthIdx === currentMonth && d === currentDate) {
                        dayBox.classList.add('is-today');
                    }

                    if (localStorage.getItem(storageKey) === 'true') {
                        dayBox.classList.add('checked');
                    }
                    
                    dayBox.onclick = () => {
                        const isChecked = dayBox.classList.toggle('checked');
                        localStorage.setItem(storageKey, isChecked);
                    };
                    
                    daysGrid.appendChild(dayBox);
                }
                
                monthGroup.appendChild(title);
                monthGroup.appendChild(daysGrid);
                root.appendChild(monthGroup);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
