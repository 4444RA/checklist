
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Habit & Journal Tracker</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: rgba(26, 26, 26, 0.9);
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --box-border: #222;
            --today-border: #ffffff;
            --bar-track: #1a1a1a;
            --bar-fill: #ffffff;

            /* Habit Colors */
            --color-meditate: #4a90e2;
            --color-yoga: #a370f7;
            --color-workout: #ff4b2b;
            --color-walk: #2ecc71;
            --color-w: #555;
        }

        * { 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; 
            display: flex; 
            overflow-x: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            cursor: default;
            user-select: none; /* Prevents text selection during double click */
        }

        /* Layout */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: margin-right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
        }

        /* Premium Glass Journal Panel */
        .journal-panel {
            width: 100%;
            max-width: 380px; 
            height: 100vh; 
            height: 100dvh;
            background: var(--panel-bg) !important; 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border-left: 1px solid rgba(255, 255, 255, 0.08) !important;
            position: fixed; 
            right: -100%; 
            top: 0; 
            padding: 40px 24px; 
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; 
            flex-direction: column; 
            z-index: 1000; 
            box-shadow: -15px 0 35px rgba(0,0,0,0.6);
            user-select: text;
        }
        .journal-panel.open { right: 0; }

        .zoom-controls { 
            position: fixed; 
            top: env(safe-area-inset-top, 20px); 
            left: 20px; 
            z-index: 1100; 
            display: flex; 
            gap: 10px; 
        }
        .zoom-btn { 
            background: #111; 
            border: 1px solid #333; 
            color: var(--text-secondary); 
            padding: 6px 14px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            transition: 0.2s; 
        }
        .zoom-btn.active { color: #fff; border-color: #666; background: #222; }

        .wrapper { 
            width: 100%; 
            max-width: 450px; 
            padding: calc(60px + env(safe-area-inset-top, 20px)) 20px 40px 20px; 
            text-align: center; 
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); 
            transform-origin: top center; 
        }
        
        @media (max-width: 480px) {
            .wrapper.x2 { transform: scale(1.3); margin-bottom: 30vh; }
        }
        @media (min-width: 481px) {
            .wrapper.x2 { transform: scale(2); margin-bottom: 120vh; }
        }

        .percentage-display { font-size: 4.5rem; font-weight: 200; margin: 0; line-height: 1; letter-spacing: -2px; }
        .progress-container { width: 100%; height: 2px; background: var(--bar-track); border-radius: 1px; margin: 2rem 0; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--bar-fill); transition: width 1.8s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .current-date { margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-secondary); border-bottom: 1px solid #1a1a1a; padding-bottom: 1.5rem; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 0.2em; }

        .summary-box {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: 12px; margin-bottom: 2rem; padding: 0 10px;
        }
        .summary-item {
            font-size: 0.65rem; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.1em;
            background: rgba(255,255,255,0.03); padding: 4px 8px; border-radius: 4px;
        }
        .summary-item span { color: #fff; font-weight: 600; }
        .summary-item.w-stat { opacity: 0.4; }

        .view-controls {
            display: inline-flex; background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px;
            padding: 3px; margin-bottom: 28px;
        }
        .view-btn {
            background: transparent; border: none; color: var(--text-secondary);
            padding: 6px 14px; font-size: 0.7rem; border-radius: 6px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }
        .view-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .month-group { text-align: left; margin-bottom: 32px; }
        .calendar-container.view-current .month-group.past,
        .calendar-container.view-current .month-group.future { display: none; }
        
        .month-title { font-size: 0.7rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 12px; letter-spacing: 0.2em; font-weight: 600; opacity: 0.5; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }

        .day-checkbox {
            aspect-ratio: 1; width: 100%; max-width: 40px;
            border: 1px solid var(--box-border); border-radius: 4px;
            cursor: pointer; position: relative; display: grid;
            grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            overflow: hidden; background: #111; transition: transform 0.2s, border-color 0.2s;
            margin: 0 auto;
        }
        .day-checkbox.is-today { border-color: var(--today-border); border-width: 1.5px; box-shadow: 0 0 10px rgba(255,255,255,0.15); }
        
        .q { width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease; }
        .q.active { opacity: 1; }
        .q-0 { background: var(--color-meditate); }
        .q-1 { background: var(--color-yoga); }
        .q-2 { background: var(--color-workout); }
        .q-3 { background: var(--color-walk); }

        .day-number {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            pointer-events: none; z-index: 2;
        }

        .journal-header { font-size: 1.4rem; font-weight: 300; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        
        .habit-item { 
            display: flex; align-items: center; margin-bottom: 18px; 
            font-size: 1rem; cursor: pointer; color: #ccc; user-select: none; padding: 4px 0; 
        }
        .habit-item input { display: none; }
        
        .custom-checkbox {
            width: 22px; height: 22px; border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px; margin-right: 14px; display: inline-block; position: relative;
            background: rgba(0, 0, 0, 0.3); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); flex-shrink: 0;
        }
        
        .habit-item input:checked + .custom-checkbox { background: #ffffff; border-color: #ffffff; }
        .habit-item input:checked + .custom-checkbox::after {
            content: ''; position: absolute; left: 7px; top: 3px;
            width: 5px; height: 10px; border: solid #000000; border-width: 0 2px 2px 0; transform: rotate(45deg);
        }

        .habit-item.w-action { margin-top: 15px; opacity: 0.15; font-size: 0.8rem; }
        .habit-item.w-action:hover { opacity: 1; }
        
        textarea {
            flex: 1; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.05);
            border-left: none; border-right: none; color: #eee; padding: 20px 24px; resize: none; 
            font-family: inherit; margin-top: 25px; line-height: 1.6; width: calc(100% + 48px); 
            margin-left: -24px; margin-right: -24px; outline: none; font-size: 16px;
        }

        .backup-section {
            margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; gap: 10px;
        }
        .backup-btn {
            flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary); padding: 8px; font-size: 0.6rem; border-radius: 4px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; transition: 0.2s;
        }
        .backup-btn:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.3); }
        
        .close-btn { 
            position: absolute; top: calc(25px + env(safe-area-inset-top, 0px)); 
            right: 25px; cursor: pointer; color: var(--text-secondary); font-size: 1.4rem; z-index: 1010;
        }
    </style>
</head>
<body id="body-root">

<div class="zoom-controls">
    <button class="zoom-btn active" id="btn-1x" onclick="setZoom(1)">1x</button>
    <button class="zoom-btn" id="btn-2x" onclick="setZoom(2)">2x</button>
</div>

<div class="main-content" id="main-content">
    <div class="wrapper" id="main-wrapper">
        <h1 class="percentage-display"><span id="percentage">0</span><span>%</span></h1>
        <div class="progress-container"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="current-date" id="full-date">---</div>
        
        <div class="summary-box" id="summary-box">
            <div class="summary-item">Meditate <span id="stat-0">0/0</span></div>
            <div class="summary-item">Yoga <span id="stat-1">0/0</span></div>
            <div class="summary-item">Workout <span id="stat-2">0/0</span></div>
            <div class="summary-item">Walk <span id="stat-3">0/0</span></div>
            <div class="summary-item w-stat">W <span id="stat-4">0/0</span></div>
        </div>

        <div class="view-controls">
            <button class="view-btn active" id="view-current-btn" onclick="setViewMode('current')">Current Month</button>
            <button class="view-btn" id="view-year-btn" onclick="setViewMode('year')">Full Year</button>
        </div>
        
        <div id="calendar-root" class="calendar-container view-current"></div>
    </div>
</div>

<div class="journal-panel" id="journal-panel">
    <div class="close-btn" onclick="closeJournal()">✕</div>
    <div class="journal-header" id="journal-date-title">Date</div>
    <div id="habit-checklist" style="display: flex; flex-direction: column; flex-grow: 1;">
        <label class="habit-item">
            <input type="checkbox" data-habit="0">
            <span class="custom-checkbox"></span>
            Meditate
        </label>
        <label class="habit-item">
            <input type="checkbox" data-habit="1">
            <span class="custom-checkbox"></span>
            Yoga
        </label>
        <label class="habit-item">
            <input type="checkbox" data-habit="2">
            <span class="custom-checkbox"></span>
            Workout
        </label>
        <label class="habit-item">
            <input type="checkbox" data-habit="3">
            <span class="custom-checkbox"></span>
            Walk
        </label>
        
        <textarea id="journal-text" placeholder="What happened today?"></textarea>

        <label class="habit-item w-action">
            <input type="checkbox" data-habit="4">
            <span class="custom-checkbox"></span>
            W
        </label>

        <div class="backup-section">
            <button class="backup-btn" onclick="saveJSON()">Save JSON</button>
            <button class="backup-btn" onclick="document.getElementById('load-input').click()">Load JSON</button>
            <input type="file" id="load-input" style="display:none" accept=".json" onchange="loadJSON(event)">
        </div>
    </div>
</div>

<script>
    let currentEditingKey = null;
    let currentScale = 1;
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    function getPerthTime() {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Australia/Perth', year: 'numeric', month: 'numeric', day: 'numeric',
            hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false
        });
        const parts = formatter.formatToParts(now);
        const d = {};
        parts.forEach(p => d[p.type] = p.value);
        return new Date(d.year, d.month - 1, d.day, d.hour, d.minute, d.second);
    }

    function setZoom(scale) {
        currentScale = scale;
        const wrapper = document.getElementById('main-wrapper');
        document.getElementById('btn-1x').classList.toggle('active', scale === 1);
        document.getElementById('btn-2x').classList.toggle('active', scale === 2);
        wrapper.className = scale === 2 ? 'wrapper x2' : 'wrapper';
    }

    function setViewMode(mode) {
        const container = document.getElementById('calendar-root');
        container.className = mode === 'current' ? "calendar-container view-current" : "calendar-container view-year";
        document.getElementById('view-current-btn').classList.toggle('active', mode === 'current');
        document.getElementById('view-year-btn').classList.toggle('active', mode === 'year');
    }

    function updateSummary() {
        const now = getPerthTime();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();
        let tallies = [0, 0, 0, 0, 0];

        for (let d = 1; d <= today; d++) {
            const key = `${year}-${month}-${d}`;
            const data = JSON.parse(localStorage.getItem(key));
            if (data && data.habits) {
                data.habits.forEach((checked, i) => { if (checked) tallies[i]++; });
            }
        }
        tallies.forEach((count, i) => {
            const el = document.getElementById(`stat-${i}`);
            if (el) el.innerText = `${count}/${today}`;
        });
    }

    function saveJSON() {
        const data = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            data[key] = localStorage.getItem(key);
        }
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `habit-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function loadJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const importedData = JSON.parse(e.target.result);
                if (confirm("This will overwrite your current data with the backup. Proceed?")) {
                    localStorage.clear();
                    Object.keys(importedData).forEach(key => localStorage.setItem(key, importedData[key]));
                    location.reload();
                }
            } catch (err) { alert("Error parsing file."); }
        };
        reader.readAsText(file);
    }

    function init() {
        const nowPerth = getPerthTime();
        const year = nowPerth.getFullYear();
        const currentMonth = nowPerth.getMonth();
        const startOfYear = new Date(year, 0, 1);
        const endOfYear = new Date(year + 1, 0, 1);
        const totalDays = Math.floor((endOfYear - startOfYear) / 86400000);
        const daysPassed = Math.floor((nowPerth - startOfYear) / 86400000) + 1;
        const percent = ((daysPassed / totalDays) * 100).toFixed(1);

        document.getElementById('percentage').innerText = percent;
        document.getElementById('full-date').innerText = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'Australia/Perth' }).format(new Date());

        setTimeout(() => { document.getElementById('progress-fill').style.width = percent + '%'; }, 300);
        generateChecklist(year, currentMonth, nowPerth.getDate());
        setupJournalListeners();
        setupInteractions();
        updateSummary();
    }

    function generateChecklist(year, currentMonth, currentDate) {
        const root = document.getElementById('calendar-root');
        root.innerHTML = '';
        months.forEach((monthName, monthIdx) => {
            const monthGroup = document.createElement('div');
            monthGroup.className = 'month-group';
            if (monthIdx < currentMonth) monthGroup.classList.add('past');
            else if (monthIdx > currentMonth) monthGroup.classList.add('future');
            else monthGroup.classList.add('current');

            const title = document.createElement('div');
            title.className = 'month-title'; title.innerText = monthName;
            const daysGrid = document.createElement('div');
            daysGrid.className = 'days-grid';
            
            const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const dateKey = `${year}-${monthIdx}-${d}`;
                const dayBox = document.createElement('div');
                dayBox.className = 'day-checkbox';
                dayBox.id = `day-${dateKey}`;
                for (let i = 0; i < 4; i++) {
                    const q = document.createElement('div');
                    q.className = `q q-${i}`;
                    dayBox.appendChild(q);
                }
                const num = document.createElement('div');
                num.className = 'day-number'; num.innerText = d;
                dayBox.appendChild(num);
                if (monthIdx === currentMonth && d === currentDate) dayBox.classList.add('is-today');
                updateBoxVisuals(dayBox, dateKey);
                dayBox.onclick = (e) => { e.stopPropagation(); openJournal(dateKey, monthName, d); };
                daysGrid.appendChild(dayBox);
            }
            monthGroup.appendChild(title);
            monthGroup.appendChild(daysGrid);
            root.appendChild(monthGroup);
        });
    }

    function openJournal(key, month, day) {
        currentEditingKey = key;
        const data = JSON.parse(localStorage.getItem(key)) || { text: "", habits: [false, false, false, false, false] };
        document.getElementById('journal-date-title').innerText = `${month} ${day}`;
        document.getElementById('journal-text').value = data.text || "";
        const checkboxes = document.querySelectorAll('#habit-checklist input[type="checkbox"]');
        checkboxes.forEach((cb, i) => cb.checked = data.habits ? !!data.habits[i] : false);
        document.getElementById('journal-panel').classList.add('open');
    }

    function closeJournal() {
        document.getElementById('journal-panel').classList.remove('open');
        currentEditingKey = null;
    }

    function setupInteractions() {
        // Toggle Zoom on Double Click
        document.addEventListener('dblclick', (e) => {
            if (e.target.closest('.zoom-controls') || e.target.closest('.view-controls') || e.target.closest('.day-checkbox') || e.target.closest('.journal-panel')) return;
            setZoom(currentScale === 1 ? 2 : 1);
        });

        // Toggle Journal on Single Click
        document.getElementById('body-root').onclick = (e) => {
            const panel = document.getElementById('journal-panel');
            if (e.target.closest('.journal-panel') || e.target.closest('.day-checkbox') || e.target.closest('.zoom-controls') || e.target.closest('.view-controls')) return;
            if (panel.classList.contains('open')) closeJournal();
            else {
                const now = getPerthTime();
                openJournal(`${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`, months[now.getMonth()], now.getDate());
            }
        };
    }

    function setupJournalListeners() {
        const text = document.getElementById('journal-text');
        const habits = document.querySelectorAll('#habit-checklist input[type="checkbox"]');
        const saveData = () => {
            if (!currentEditingKey) return;
            const habitValues = Array.from(habits).map(cb => cb.checked);
            localStorage.setItem(currentEditingKey, JSON.stringify({ text: text.value, habits: habitValues }));
            updateBoxVisuals(document.getElementById(`day-${currentEditingKey}`), currentEditingKey);
            updateSummary();
        };
        text.oninput = saveData;
        habits.forEach(cb => cb.onchange = saveData);
    }

    function updateBoxVisuals(element, key) {
        if (!element) return;
        const data = JSON.parse(localStorage.getItem(key));
        const quadrants = element.querySelectorAll('.q');
        quadrants.forEach((q, i) => {
            if (data && data.habits && data.habits[i]) q.classList.add('active');
            else q.classList.remove('active');
        });
    }

    window.onload = init;
</script>

</body>
</html>
